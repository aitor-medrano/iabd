<svg viewBox="0 0 980 884" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker>
    <style>
      .svc{fill:#ffffff;stroke:#ced4da;stroke-width:1.4}
      .svct{font-weight:600;font-size:13px;fill:#212529;text-anchor:middle}
      .sub{font-size:10.5px;fill:#868e96;text-anchor:middle}
      .glab{font-weight:600;font-size:13px}
      .cyl{fill:#f1f3f5;stroke:#868e96;stroke-width:1.3}
      .cyltop{fill:#e9ecef;stroke:#868e96;stroke-width:1.3}
      .one{fill:#f8f9fa;stroke:#adb5bd;stroke-width:1.3;stroke-dasharray:5 3}
      .onet{font-weight:600;font-size:12px;fill:#868e96;text-anchor:middle}
      .ctrl{fill:none;stroke:#495057;stroke-width:1.6}
      .data{fill:none;stroke:#1971c2;stroke-width:1.6;stroke-dasharray:5 4}
      .ss{fill:none;stroke:#7048e8;stroke-width:1.6;stroke-dasharray:5 4}
      .initl{fill:none;stroke:#868e96;stroke-width:1.4;stroke-dasharray:4 3}
      .quo{fill:none;stroke:#868e96;stroke-width:1.4}
      .elabb{font-weight:600;font-size:11px;fill:#1971c2}
      .elabp{font-weight:600;font-size:11px;fill:#7048e8}
      .elab{font-weight:600;font-size:11px;fill:#495057}
      .elabg{font-weight:600;font-size:10.5px;fill:#868e96}
    </style>
  </defs>

  <!-- Host -->
  <rect x="366" y="24" width="248" height="44" rx="10" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.4"/>
  <text x="490" y="51" text-anchor="middle" font-weight="600" font-size="13" fill="#212529">Tu equipo — navegador · spark-submit</text>
  <line x1="490" y1="68" x2="490" y2="91" class="ctrl" marker-end="url(#arrowDark)"/>
  <text x="500" y="85" font-size="10.5" fill="#868e96">localhost · puertos publicados</text>

  <!-- Red Docker -->
  <rect x="24" y="92" width="932" height="768" rx="14" fill="none" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="40" y="115" font-weight="600" font-size="13" fill="#495057">Red Docker: spark-cluster_spark-net</text>

  <!-- GRUPOS -->
  <rect x="48"  y="128" width="560" height="372" rx="10" fill="#FFF4E6" stroke="#E8590C" stroke-width="1.5"/>
  <text x="64"  y="150" class="glab" fill="#E8590C">perfil: spark / spark-single</text>
  <rect x="640" y="128" width="300" height="96"  rx="10" fill="#E7F5FF" stroke="#1971C2" stroke-width="1.5"/>
  <text x="656" y="150" class="glab" fill="#1971C2">perfil: datos</text>
  <rect x="640" y="240" width="300" height="260" rx="10" fill="#E6FCF5" stroke="#0CA678" stroke-width="1.5"/>
  <text x="656" y="262" class="glab" fill="#0CA678">perfil: airflow</text>
  <rect x="48"  y="528" width="372" height="180" rx="10" fill="#F3F0FF" stroke="#6741D9" stroke-width="1.5"/>
  <text x="64"  y="550" class="glab" fill="#6741D9">perfil: kafka</text>
  <rect x="444" y="528" width="172" height="180" rx="10" fill="#F8F0FC" stroke="#9C36B5" stroke-width="1.5"/>
  <text x="456" y="550" class="glab" fill="#9C36B5" font-size="12">perfil: kafka-connect</text>
  <rect x="48" y="724" width="568" height="120" rx="10" fill="#F3F0FF" stroke="#6741D9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="64" y="746" class="glab" fill="#6741D9" font-size="12">perfil: kafka-cluster</text>
  <text x="214" y="746" font-size="11" fill="#868e96">alternativa a perfil kafka (excluyentes) · usa el mismo kafka-ui</text>

  <!-- Leyenda -->
  <rect x="648" y="560" width="292" height="176" rx="10" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.3"/>
  <text x="664" y="584" font-weight="600" font-size="13" fill="#495057">Leyenda</text>
  <line x1="666" y1="606" x2="708" y2="606" class="ctrl" marker-end="url(#arrowDark)"/>
  <text x="718" y="610" font-size="11.5" fill="#495057">control / driver</text>
  <line x1="666" y1="634" x2="708" y2="634" class="data" marker-end="url(#arrowBlue)"/>
  <text x="718" y="638" font-size="11.5" fill="#495057">acceso a datos (s3a · JDBC · metastore)</text>
  <line x1="666" y1="662" x2="708" y2="662" class="ss" marker-end="url(#arrowPurple)"/>
  <text x="718" y="666" font-size="11.5" fill="#495057">SparkSubmit (Airflow → Spark)</text>
  <line x1="666" y1="690" x2="708" y2="690" class="initl" marker-end="url(#arrowGrey)"/>
  <text x="718" y="694" font-size="11.5" fill="#495057">init (one-shot)</text>
  <path class="cyl" d="M668,712 A12,4 0 0 1 692,712 V726 A12,4 0 0 1 668,726 Z"/>
  <ellipse class="cyltop" cx="680" cy="712" rx="12" ry="4"/>
  <text x="718" y="722" font-size="11.5" fill="#495057">almacén de datos</text>

  <!-- ARISTAS -->
  <line x1="230" y1="197" x2="328" y2="197" class="ctrl" marker-end="url(#arrowDark)"/>
  <text x="280" y="191" class="elab" text-anchor="middle">driver</text>
  <line x1="360" y1="224" x2="184" y2="257" class="ctrl" marker-end="url(#arrowDark)"/>
  <line x1="405" y1="224" x2="405" y2="257" class="ctrl" marker-end="url(#arrowDark)"/>
  <line x1="814" y1="313" x2="838" y2="338" class="ctrl" marker-end="url(#arrowDark)"/>
  <line x1="814" y1="385" x2="838" y2="360" class="ctrl" marker-end="url(#arrowDark)"/>

  <polyline points="330,210 290,210 290,326 175,326 175,341" class="data" marker-end="url(#arrowBlue)"/>
  <text x="246" y="319" class="elabb">s3a://</text>
  <polyline points="480,210 540,210 540,367 482,367" class="data" marker-end="url(#arrowBlue)"/>
  <text x="534" y="300" class="elabb" transform="rotate(-90 534 300)" text-anchor="middle">metastore</text>
  <polyline points="530,584 530,320 135,320 135,341" class="data" marker-end="url(#arrowBlue)"/>
  <text x="524" y="458" class="elabb" transform="rotate(-90 524 458)" text-anchor="middle">S3 sink</text>
  <polyline points="600,600 624,600 624,187 698,187" class="data" marker-end="url(#arrowBlue)"/>
  <text x="618" y="430" class="elabb" transform="rotate(-90 618 430)" text-anchor="middle">JDBC source</text>
  <line x1="460" y1="610" x2="404" y2="610" class="data" marker-end="url(#arrowBlue)"/>
  <text x="432" y="604" class="elabb" text-anchor="middle">broker</text>

  <polyline points="664,385 638,385 638,203 482,203" class="ss" marker-end="url(#arrowPurple)"/>
  <text x="648" y="300" class="elabp" transform="rotate(-90 648 300)" text-anchor="middle">SparkSubmit</text>

  <!-- one-shots -->
  <line x1="155" y1="440" x2="155" y2="398" class="initl" marker-end="url(#arrowGrey)"/>
  <text x="163" y="423" class="elabg">crea buckets</text>
  <line x1="405" y1="440" x2="405" y2="398" class="initl" marker-end="url(#arrowGrey)"/>
  <text x="413" y="423" class="elabg">init esquema</text>
  <line x1="812" y1="448" x2="864" y2="376" class="initl" marker-end="url(#arrowGrey)"/>
  <text x="744" y="442" class="elabg">db migrate</text>

  <!-- quorum -->
  <line x1="230" y1="799" x2="256" y2="799" class="quo"/>
  <line x1="406" y1="799" x2="432" y2="799" class="quo"/>
  <text x="324" y="836" font-size="10.5" fill="#868e96" text-anchor="middle">quórum KRaft · réplicas entre brokers</text>

  <!-- SERVICIOS spark -->
  <rect class="svc" x="80"  y="170" width="150" height="54" rx="8"/>
  <text class="svct" x="155" y="194">jupyter</text><text class="sub" x="155" y="210">driver</text>
  <rect class="svc" x="330" y="170" width="150" height="54" rx="8"/>
  <text class="svct" x="405" y="201">spark-master</text>
  <rect class="svc" x="80"  y="258" width="150" height="54" rx="8"/>
  <text class="svct" x="155" y="289">spark-worker-1</text>
  <rect class="svc" x="330" y="258" width="150" height="54" rx="8"/>
  <text class="svct" x="405" y="281">spark-worker-2</text><text class="sub" x="405" y="297">(solo perfil spark)</text>

  <path class="cyl" d="M80,347 A75,7 0 0 1 230,347 V387 A75,7 0 0 1 80,387 Z"/>
  <ellipse class="cyltop" cx="155" cy="347" rx="75" ry="7"/>
  <text class="svct" x="155" y="371">minio</text><text class="sub" x="155" y="385">S3</text>
  <path class="cyl" d="M330,347 A75,7 0 0 1 480,347 V387 A75,7 0 0 1 330,387 Z"/>
  <ellipse class="cyltop" cx="405" cy="347" rx="75" ry="7"/>
  <text class="svct" x="405" y="373" font-size="12">mysql-metastore</text>

  <rect class="one" x="80" y="440" width="150" height="44" rx="8"/>
  <text class="onet" x="155" y="458">minio-init</text><text class="sub" x="155" y="473">one-shot</text>
  <rect class="one" x="330" y="440" width="150" height="44" rx="8"/>
  <text class="onet" x="405" y="458">hive-init</text><text class="sub" x="405" y="473">one-shot</text>

  <!-- SERVICIOS datos -->
  <path class="cyl" d="M700,169 A90,7 0 0 1 880,169 V205 A90,7 0 0 1 700,205 Z"/>
  <ellipse class="cyltop" cx="790" cy="169" rx="90" ry="7"/>
  <text class="svct" x="790" y="186">mysql-datos</text><text class="sub" x="790" y="200">retail_db</text>

  <!-- SERVICIOS airflow -->
  <rect class="svc" x="664" y="288" width="150" height="50" rx="8"/>
  <text class="svct" x="739" y="317" font-size="12">airflow-webserver</text>
  <rect class="svc" x="664" y="360" width="150" height="50" rx="8"/>
  <text class="svct" x="739" y="389" font-size="12">airflow-scheduler</text>
  <rect class="one" x="664" y="430" width="150" height="44" rx="8"/>
  <text class="onet" x="739" y="448">airflow-init</text><text class="sub" x="739" y="463">one-shot</text>
  <path class="cyl" d="M836,331 A48,7 0 0 1 932,331 V367 A48,7 0 0 1 836,367 Z"/>
  <ellipse class="cyltop" cx="884" cy="331" rx="48" ry="7"/>
  <text class="svct" x="884" y="354" font-size="10.5">postgres-airflow</text>

  <!-- SERVICIOS kafka -->
  <rect class="svc" x="80"  y="584" width="150" height="52" rx="8"/>
  <text class="svct" x="155" y="615">kafka-ui</text>
  <rect class="svc" x="252" y="584" width="150" height="52" rx="8"/>
  <text class="svct" x="327" y="607">kafka</text><text class="sub" x="327" y="623">broker KRaft</text>

  <!-- SERVICIOS kafka-connect -->
  <rect class="svc" x="460" y="584" width="140" height="52" rx="8"/>
  <text class="svct" x="530" y="615">kafka-connect</text>

  <!-- SERVICIOS kafka-cluster -->
  <rect class="svc" x="80"  y="772" width="150" height="54" rx="8"/>
  <text class="svct" x="155" y="796">kafka-1</text><text class="sub" x="155" y="812">broker KRaft</text>
  <rect class="svc" x="256" y="772" width="150" height="54" rx="8"/>
  <text class="svct" x="331" y="796">kafka-2</text><text class="sub" x="331" y="812">broker KRaft</text>
  <rect class="svc" x="432" y="772" width="150" height="54" rx="8"/>
  <text class="svct" x="507" y="796">kafka-3</text><text class="sub" x="507" y="812">broker KRaft</text>
</svg>
