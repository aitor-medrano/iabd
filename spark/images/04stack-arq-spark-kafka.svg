<svg viewBox="0 0 820 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="aD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker>
    <style>
      .svc{fill:#fff;stroke:#ced4da;stroke-width:1.4}
      .svct{font-weight:600;font-size:13px;fill:#212529;text-anchor:middle}
      .sub{font-size:10.5px;fill:#868e96;text-anchor:middle}
      .cyl{fill:#f1f3f5;stroke:#868e96;stroke-width:1.3}
      .cyltop{fill:#e9ecef;stroke:#868e96;stroke-width:1.3}
      .one{fill:#f8f9fa;stroke:#adb5bd;stroke-width:1.3;stroke-dasharray:5 3}
      .onet{font-weight:600;font-size:12px;fill:#868e96;text-anchor:middle}
      .ctrl{fill:none;stroke:#495057;stroke-width:1.6}
      .data{fill:none;stroke:#1971c2;stroke-width:1.6;stroke-dasharray:5 4}
      .init{fill:none;stroke:#868e96;stroke-width:1.4;stroke-dasharray:4 3}
      .quo{fill:none;stroke:#868e96;stroke-width:1.4}
      .e{font-weight:600;font-size:11px;fill:#495057}
      .eb{font-weight:600;font-size:11px;fill:#1971c2}
      .eg{font-weight:600;font-size:10.5px;fill:#868e96}
    </style>
  </defs>

  <!-- Grupo kafka -->
  <rect x="30" y="50" width="230" height="150" rx="10" fill="#F3F0FF" stroke="#6741D9" stroke-width="1.5"/>
  <text x="46" y="72" font-weight="600" font-size="13" fill="#6741D9">perfil: kafka</text>

  <!-- Grupo kafka-connect -->
  <rect x="30" y="216" width="230" height="96" rx="10" fill="#F8F0FC" stroke="#9C36B5" stroke-width="1.5"/>
  <text x="46" y="238" font-weight="600" font-size="12" fill="#9C36B5">perfil: kafka-connect</text>

  <!-- Grupo spark -->
  <rect x="300" y="40" width="490" height="380" rx="10" fill="#FFF4E6" stroke="#E8590C" stroke-width="1.5"/>
  <text x="316" y="62" font-weight="600" font-size="13" fill="#E8590C">perfil: spark / spark-single</text>

  <!-- Grupo kafka-cluster (alternativa) -->
  <rect x="30" y="450" width="760" height="130" rx="10" fill="#F3F0FF" stroke="#6741D9" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="472" font-weight="600" font-size="12" fill="#6741D9">perfil: kafka-cluster</text>
  <text x="196" y="472" font-size="11" fill="#868e96">· alternativa a perfil kafka (excluyentes) · usa el mismo kafka-ui</text>

  <!-- aristas -->
  <polyline points="210,114 290,114 290,123 328,123" class="data" marker-end="url(#aB)"/>
  <text x="250" y="107" class="eb" text-anchor="middle">readStream</text>

  <polyline points="210,276 250,276 250,114 212,114" class="data" marker-end="url(#aB)"/>
  <text x="244" y="200" class="eb" transform="rotate(-90 244 200)" text-anchor="middle">connectors</text>

  <line x1="480" y1="123" x2="558" y2="123" class="ctrl" marker-end="url(#aD)"/>
  <text x="519" y="117" class="e" text-anchor="middle">driver</text>
  <line x1="590" y1="150" x2="434" y2="186" class="ctrl" marker-end="url(#aD)"/>
  <line x1="635" y1="150" x2="635" y2="186" class="ctrl" marker-end="url(#aD)"/>

  <polyline points="560,130 500,130 500,266 410,266 410,285" class="data" marker-end="url(#aB)"/>
  <text x="452" y="260" class="eb">s3a://</text>
  <polyline points="710,130 735,130 735,313 712,313" class="data" marker-end="url(#aB)"/>
  <text x="729" y="225" class="eb" transform="rotate(-90 729 225)" text-anchor="middle">metastore</text>

  <line x1="405" y1="360" x2="405" y2="344" class="init" marker-end="url(#aG)"/>
  <text x="413" y="356" class="eg">crea buckets</text>
  <line x1="635" y1="360" x2="635" y2="344" class="init" marker-end="url(#aG)"/>
  <text x="643" y="356" class="eg">init esquema</text>

  <line x1="220" y1="525" x2="333" y2="525" class="quo"/>
  <line x1="487" y1="525" x2="598" y2="525" class="quo"/>
  <text x="410" y="566" font-size="10.5" fill="#868e96" text-anchor="middle">quórum KRaft · réplicas entre brokers</text>

  <!-- nodos kafka -->
  <rect class="svc" x="60" y="90" width="150" height="48" rx="8"/>
  <text class="svct" x="135" y="111">kafka</text><text class="sub" x="135" y="127">broker KRaft</text>
  <rect class="svc" x="60" y="148" width="150" height="42" rx="8"/>
  <text class="svct" x="135" y="174">kafka-ui</text>

  <!-- nodo kafka-connect -->
  <rect class="svc" x="60" y="252" width="150" height="48" rx="8"/>
  <text class="svct" x="135" y="280">kafka-connect</text>

  <!-- nodos spark -->
  <rect class="svc" x="330" y="96" width="150" height="54" rx="8"/>
  <text class="svct" x="405" y="120">jupyter</text><text class="sub" x="405" y="136">driver</text>
  <rect class="svc" x="560" y="96" width="150" height="54" rx="8"/>
  <text class="svct" x="635" y="127">spark-master</text>
  <rect class="svc" x="330" y="186" width="150" height="54" rx="8"/>
  <text class="svct" x="405" y="217">spark-worker-1</text>
  <rect class="svc" x="560" y="186" width="150" height="54" rx="8"/>
  <text class="svct" x="635" y="209">spark-worker-2</text><text class="sub" x="635" y="225">(solo perfil spark)</text>

  <path class="cyl" d="M330,293 A75,7 0 0 1 480,293 V335 A75,7 0 0 1 330,335 Z"/>
  <ellipse class="cyltop" cx="405" cy="293" rx="75" ry="7"/>
  <text class="svct" x="405" y="317">minio</text><text class="sub" x="405" y="331">S3</text>
  <path class="cyl" d="M560,293 A75,7 0 0 1 710,293 V335 A75,7 0 0 1 560,335 Z"/>
  <ellipse class="cyltop" cx="635" cy="293" rx="75" ry="7"/>
  <text class="svct" x="635" y="319" font-size="12">mysql-metastore</text>

  <rect class="one" x="330" y="360" width="150" height="44" rx="8"/>
  <text class="onet" x="405" y="378">minio-init</text><text class="sub" x="405" y="393">one-shot</text>
  <rect class="one" x="560" y="360" width="150" height="44" rx="8"/>
  <text class="onet" x="635" y="378">hive-init</text><text class="sub" x="635" y="393">one-shot</text>

  <!-- nodos kafka-cluster -->
  <rect class="svc" x="70" y="498" width="150" height="54" rx="8"/>
  <text class="svct" x="145" y="522">kafka-1</text><text class="sub" x="145" y="538">broker KRaft</text>
  <rect class="svc" x="335" y="498" width="150" height="54" rx="8"/>
  <text class="svct" x="410" y="522">kafka-2</text><text class="sub" x="410" y="538">broker KRaft</text>
  <rect class="svc" x="600" y="498" width="150" height="54" rx="8"/>
  <text class="svct" x="675" y="522">kafka-3</text><text class="sub" x="675" y="538">broker KRaft</text>

  <!-- leyenda -->
  <rect x="40" y="332" width="210" height="92" rx="8" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.2"/>
  <line x1="54" y1="352" x2="86" y2="352" class="ctrl" marker-end="url(#aD)"/><text x="94" y="356" font-size="10.5" fill="#495057">control / driver</text>
  <line x1="54" y1="378" x2="86" y2="378" class="data" marker-end="url(#aB)"/><text x="94" y="382" font-size="10.5" fill="#495057">datos (readStream · connectors · s3a)</text>
  <line x1="54" y1="404" x2="86" y2="404" class="init" marker-end="url(#aG)"/><text x="94" y="408" font-size="10.5" fill="#495057">init (one-shot)</text>
</svg>
