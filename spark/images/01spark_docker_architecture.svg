<svg width="100%" viewBox="0 0 720 820" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .lbl-title { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; }
    .lbl-sub   { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; }
    .lbl-edge  { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 400; }
    .lbl-foot  { font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; fill: #3d3d3a; }
    .arrow-line { stroke: #73726c; stroke-width: 1.5; fill: none; }
    .arrow-thin { stroke: #3d3d3a; stroke-width: 0.8; fill: none; }
  </style>
</defs>

<!-- Badge -->
<g transform="translate(40, 30)">
  <rect x="0" y="0" width="180" height="22" rx="4" fill="#e9f1dc" stroke="#437426" stroke-width="0.5"/>
  <text x="90" y="15" text-anchor="middle" fill="#3d3d3a" class="lbl-sub">100% imágenes oficiales</text>
</g>

<!-- ===== JUPYTER ===== -->
<g onclick="sendPrompt('Cómo se conecta Jupyter al cluster Spark?')">
  <rect x="240" y="30" width="240" height="56" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text x="360" y="50" text-anchor="middle" dominant-baseline="central" fill="#633806" class="lbl-title">jupyter</text>
  <text x="360" y="70" text-anchor="middle" dominant-baseline="central" fill="#854f0b" class="lbl-sub">:8888 Jupyter Lab · :4040 Spark UI driver</text>
</g>

<!-- Arrow Jupyter to Spark -->
<line x1="360" y1="86" x2="360" y2="140" class="arrow-line" marker-end="url(#arrow)"/>
<text x="368" y="116" class="lbl-edge" fill="#3d3d3a">submit</text>

<!-- ===== SPARK CLUSTER ===== -->
<g>
  <rect x="60" y="140" width="600" height="180" rx="16" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="360" y="166" text-anchor="middle" dominant-baseline="central" fill="#3c3489" class="lbl-title">Spark 4.1.1 · standalone cluster (apache/spark, Scala 2.13)</text>
</g>

<!-- Spark Master -->
<g onclick="sendPrompt('Qué hace el Spark Master?')">
  <rect x="260" y="186" width="200" height="48" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="360" y="202" text-anchor="middle" dominant-baseline="central" fill="#3c3489" class="lbl-title">spark-master</text>
  <text x="360" y="220" text-anchor="middle" dominant-baseline="central" fill="#534ab7" class="lbl-sub">:7077 · UI :8080</text>
</g>

<!-- Workers -->
<g onclick="sendPrompt('Cómo funcionan los Spark Workers?')">
  <rect x="100" y="260" width="200" height="48" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="200" y="276" text-anchor="middle" dominant-baseline="central" fill="#3c3489" class="lbl-title">spark-worker-1</text>
  <text x="200" y="294" text-anchor="middle" dominant-baseline="central" fill="#534ab7" class="lbl-sub">2 cores · 4 GB</text>
</g>
<g onclick="sendPrompt('Cómo funcionan los Spark Workers?')">
  <rect x="420" y="260" width="200" height="48" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="520" y="276" text-anchor="middle" dominant-baseline="central" fill="#3c3489" class="lbl-title">spark-worker-2</text>
  <text x="520" y="294" text-anchor="middle" dominant-baseline="central" fill="#534ab7" class="lbl-sub">2 cores · 4 GB</text>
</g>

<!-- Master to workers -->
<line x1="320" y1="234" x2="240" y2="260" class="arrow-line" marker-end="url(#arrow)"/>
<line x1="400" y1="234" x2="480" y2="260" class="arrow-line" marker-end="url(#arrow)"/>

<!-- ===== DATA LAYER (4 boxes: MySQL metastore, MySQL datos, MinIO, Kafka) ===== -->

<!-- MySQL metastore -->
<g onclick="sendPrompt('Cómo funciona el Hive Metastore con MySQL?')">
  <rect x="40" y="400" width="150" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="115" y="418" text-anchor="middle" dominant-baseline="central" fill="#085041" class="lbl-title">mysql-metastore</text>
  <text x="115" y="436" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" class="lbl-sub">:3306 · MySQL 8</text>
  <text x="115" y="452" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" class="lbl-sub">Hive metastore</text>
</g>

<!-- MySQL datos (retail_db) -->
<g onclick="sendPrompt('Para qué sirve el contenedor mysql-datos con retail_db?')">
  <rect x="205" y="400" width="150" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="280" y="418" text-anchor="middle" dominant-baseline="central" fill="#085041" class="lbl-title">mysql-datos</text>
  <text x="280" y="436" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" class="lbl-sub">:3307 · MySQL 8</text>
  <text x="280" y="452" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" class="lbl-sub">retail_db (datos)</text>
</g>

<!-- MinIO -->
<g onclick="sendPrompt('Cómo se conecta Spark a MinIO vía S3A?')">
  <rect x="370" y="400" width="160" height="60" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="450" y="418" text-anchor="middle" dominant-baseline="central" fill="#085041" class="lbl-title">minio</text>
  <text x="450" y="436" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" class="lbl-sub">:9000 S3 · :9001 UI</text>
  <text x="450" y="452" text-anchor="middle" dominant-baseline="central" fill="#0f6e56" class="lbl-sub">warehouse · raw-data</text>
</g>

<!-- Kafka -->
<g onclick="sendPrompt('Cómo se usa Kafka con Spark Structured Streaming?')">
  <rect x="545" y="400" width="135" height="60" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text x="612" y="418" text-anchor="middle" dominant-baseline="central" fill="#712b13" class="lbl-title">kafka</text>
  <text x="612" y="436" text-anchor="middle" dominant-baseline="central" fill="#993c1d" class="lbl-sub">:9092 int · :9094 ext</text>
  <text x="612" y="452" text-anchor="middle" dominant-baseline="central" fill="#993c1d" class="lbl-sub">apache/kafka · KRaft</text>
</g>

<!-- Spark cluster to data layer -->
<line x1="180" y1="308" x2="115" y2="400" class="arrow-thin" marker-end="url(#arrow)"/>
<line x1="260" y1="308" x2="280" y2="400" class="arrow-thin" marker-end="url(#arrow)"/>
<line x1="450" y1="308" x2="450" y2="400" class="arrow-thin" marker-end="url(#arrow)"/>
<line x1="540" y1="308" x2="600" y2="400" class="arrow-thin" marker-end="url(#arrow)"/>

<!-- Labels on data arrows -->
<text x="125" y="358" text-anchor="middle" transform="rotate(-30,125,358)" class="lbl-edge" fill="#3d3d3a">JDBC (metadatos)</text>
<text x="278" y="358" text-anchor="middle" transform="rotate(8,278,358)" class="lbl-edge" fill="#3d3d3a">JDBC (datos)</text>
<text x="425" y="356" text-anchor="start" class="lbl-edge" fill="#3d3d3a">S3A</text>
<text x="615" y="345" text-anchor="middle" transform="rotate(38,615,345)" class="lbl-edge" fill="#3d3d3a">kafka://</text>

<!-- ===== INIT &amp; SUPPORT SERVICES ===== -->

<!-- hive-init -->
<g onclick="sendPrompt('Qué hace el contenedor hive-init con schematool?')">
  <rect x="40" y="510" width="150" height="60" rx="8" fill="#fbeaf0" stroke="#993556" stroke-width="0.5"/>
  <text x="115" y="528" text-anchor="middle" dominant-baseline="central" fill="#72243e" class="lbl-title">hive-init</text>
  <text x="115" y="546" text-anchor="middle" dominant-baseline="central" fill="#993556" class="lbl-sub">apache/hive:4.0.1</text>
  <text x="115" y="562" text-anchor="middle" dominant-baseline="central" fill="#993556" class="lbl-sub">schematool init</text>
</g>
<line x1="115" y1="460" x2="115" y2="510" class="arrow-thin" marker-end="url(#arrow)"/>

<!-- minio-init -->
<g onclick="sendPrompt('Qué hace el contenedor minio-init?')">
  <rect x="370" y="510" width="160" height="60" rx="8" fill="#fbeaf0" stroke="#993556" stroke-width="0.5"/>
  <text x="450" y="528" text-anchor="middle" dominant-baseline="central" fill="#72243e" class="lbl-title">minio-init</text>
  <text x="450" y="546" text-anchor="middle" dominant-baseline="central" fill="#993556" class="lbl-sub">minio/mc</text>
  <text x="450" y="562" text-anchor="middle" dominant-baseline="central" fill="#993556" class="lbl-sub">crea buckets</text>
</g>
<line x1="450" y1="460" x2="450" y2="510" class="arrow-thin" marker-end="url(#arrow)"/>

<!-- Kafka UI -->
<g onclick="sendPrompt('Cómo accedo a Kafka UI?')">
  <rect x="545" y="510" width="135" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="612" y="528" text-anchor="middle" dominant-baseline="central" fill="#444441" class="lbl-title">kafka-ui</text>
  <text x="612" y="546" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" class="lbl-sub">:8081</text>
  <text x="612" y="562" text-anchor="middle" dominant-baseline="central" fill="#5f5e5a" class="lbl-sub">provectuslabs</text>
</g>
<line x1="612" y1="460" x2="612" y2="510" class="arrow-thin" marker-end="url(#arrow)"/>

<!-- "runs once" labels for init containers -->
<text x="115" y="588" text-anchor="middle" class="lbl-edge" fill="#73726c">ejecuta una vez y para</text>
<text x="450" y="588" text-anchor="middle" class="lbl-edge" fill="#73726c">ejecuta una vez y para</text>

<!-- ===== NETWORK ===== -->
<rect x="40" y="620" width="640" height="36" rx="8" fill="#f5f4ed" stroke="rgba(31,30,29,0.25)" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="360" y="642" text-anchor="middle" dominant-baseline="central" fill="#141413" class="lbl-title">spark-cluster_spark-net (bridge)</text>

<!-- Lines to network (dashed) -->
<line x1="115" y1="570" x2="115" y2="620" stroke="rgba(31,30,29,0.25)" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="280" y1="460" x2="280" y2="620" stroke="rgba(31,30,29,0.25)" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="450" y1="570" x2="450" y2="620" stroke="rgba(31,30,29,0.25)" stroke-width="0.5" stroke-dasharray="3 3"/>
<line x1="612" y1="570" x2="612" y2="620" stroke="rgba(31,30,29,0.25)" stroke-width="0.5" stroke-dasharray="3 3"/>

<!-- ===== LEGEND ===== -->
<g transform="translate(40,685)">
  <rect x="0" y="0" width="14" height="14" rx="3" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
  <text x="22" y="11" class="lbl-sub" fill="#3d3d3a">Interfaz</text>

  <rect x="90" y="0" width="14" height="14" rx="3" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
  <text x="112" y="11" class="lbl-sub" fill="#3d3d3a">Spark</text>

  <rect x="165" y="0" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
  <text x="187" y="11" class="lbl-sub" fill="#3d3d3a">Almacenamiento</text>

  <rect x="305" y="0" width="14" height="14" rx="3" fill="#faece7" stroke="#993c1d" stroke-width="0.5"/>
  <text x="327" y="11" class="lbl-sub" fill="#3d3d3a">Streaming</text>

  <rect x="410" y="0" width="14" height="14" rx="3" fill="#fbeaf0" stroke="#993556" stroke-width="0.5"/>
  <text x="432" y="11" class="lbl-sub" fill="#3d3d3a">Init (efímeros)</text>

  <rect x="555" y="0" width="14" height="14" rx="3" fill="#f1efe8" stroke="#5f5e5a" stroke-width="0.5"/>
  <text x="577" y="11" class="lbl-sub" fill="#3d3d3a">Soporte</text>
</g>

<!-- ===== FOOTER ===== -->
<text x="360" y="730" text-anchor="middle" class="lbl-foot">Puertos host: 8888 (jupyter) · 4040 (Spark UI driver) · 8080 (spark-master UI) · 9000/9001 (minio) · 8081 (kafka-ui)</text>
<text x="360" y="750" text-anchor="middle" class="lbl-foot">3306 (mysql-metastore) · 3307 (mysql-datos) · 9094 (kafka externo) · 7077 (spark-master, sólo red interna)</text>

<text x="360" y="778" text-anchor="middle" class="lbl-foot">11 contenedores · 9 persistentes + 2 efímeros (hive-init, minio-init) · Delta Lake activado por defecto</text>
<text x="360" y="798" text-anchor="middle" class="lbl-foot">Configuración común en spark-defaults.conf montada en spark-master, workers y jupyter</text>

</svg>
