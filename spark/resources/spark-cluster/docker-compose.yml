services:

  # ============================================================
  #  BASE DE DATOS - MySQL (Hive Metastore)
  # ============================================================
  iabd-mysql:
    image: mysql:8.0
    container_name: iabd-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hive_metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: hivepass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spark-net

  iabd-hive-init:
    image: apache/hive:4.0.1
    container_name: iabd-hive-init
    entrypoint: /opt/hive/bin/schematool
    command: ["-initSchema", "-dbType", "mysql",
              "-url", "jdbc:mysql://iabd-mysql:3306/hive_metastore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true",
              "-driver", "com.mysql.cj.jdbc.Driver",
              "-userName", "hive", "-passWord", "hivepass"]
    volumes:
      - ./jars/mysql-connector-j-8.0.33.jar:/opt/hive/lib/mysql-connector-j-8.0.33.jar
    depends_on:
      iabd-mysql:
        condition: service_healthy
    networks:
      - spark-net
    restart: "no"
      
  # ============================================================
  #  ALMACENAMIENTO - MinIO (compatible S3)
  # ============================================================
  iabd-minio:
    image: minio/minio:latest
    container_name: iabd-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'   # API S3
      - '9001:9001'   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-net

  # Crea buckets iniciales al arrancar
  iabd-minio-init:
    image: minio/mc:latest
    container_name: iabd-minio-init
    depends_on:
      iabd-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://iabd-minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/warehouse &&
        mc mb --ignore-existing local/raw-data &&
        mc mb --ignore-existing local/processed &&
        echo '>>> Buckets creados correctamente'
      "
    networks:
      - spark-net

  # ============================================================
  #  STREAMING - Kafka (con KRaft, sin Zookeeper)
  # ============================================================
  iabd-kafka:
    image: apache/kafka:latest
    container_name: iabd-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@iabd-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://iabd-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - '9094:9094'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - spark-net

  # UI para Kafka
  iabd-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: iabd-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: iabd-kafka:9092
    ports:
      - '8081:8080'
    depends_on:
      iabd-kafka:
        condition: service_healthy
    networks:
      - spark-net

  # ============================================================
  #  SPARK 4 - Master (imagen oficial Apache)
  # ============================================================
  iabd-spark-master:
    image: apache/spark:4.1.1
    container_name: iabd-spark-master
    command: /opt/spark/sbin/start-master.sh
    ports:
      - '8080:8080'   # Spark Master UI
      - '7077:7077'   # Spark Master
    volumes:
      - ./jars:/opt/spark/extra-jars
      - ./spark-config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    environment:
      SPARK_MASTER_HOST: iabd-spark-master
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      iabd-mysql:
        condition: service_healthy
      iabd-minio:
        condition: service_healthy
    networks:
      - spark-net

  # ============================================================
  #  SPARK 4 - Workers
  # ============================================================
  iabd-spark-worker-1:
    image: apache/spark:4.1.1
    container_name: iabd-spark-worker-1
    command: /opt/spark/sbin/start-worker.sh spark://iabd-spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_NO_DAEMONIZE: "true"
    mem_limit: 5g
    volumes:
      - ./jars:/opt/spark/extra-jars
      - ./spark-config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      - iabd-spark-master
    networks:
      - spark-net

  iabd-spark-worker-2:
    image: apache/spark:4.1.1
    container_name: iabd-spark-worker-2
    command: /opt/spark/sbin/start-worker.sh spark://iabd-spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: "4g"
      SPARK_NO_DAEMONIZE: "true"
    mem_limit: 5g
    volumes:
      - ./jars:/opt/spark/extra-jars
      - ./spark-config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    depends_on:
      - iabd-spark-master
    networks:
      - spark-net

  # ============================================================
  #  JUPYTER - Notebooks con PySpark (Spark 4)
  #  Imagen oficial Jupyter migrada a Quay.io
  # ============================================================
  iabd-jupyter:
    build: ./jupyter
    container_name: iabd-jupyter
    mem_limit: 4g
    ports:
      - '8888:8888'
      - '4040:4040'   # Spark UI del driver
    volumes:
      - ./notebooks:/home/spark/work
      - ./jars:/opt/spark/extra-jars
    depends_on:
      - iabd-spark-master
      - iabd-mysql
      - iabd-minio
      - iabd-kafka
    networks:
      - spark-net

# ============================================================
#  VOLUMES & NETWORK
# ============================================================
volumes:
  mysql_data:
  minio_data:
  kafka_data:

networks:
  spark-net:
    driver: bridge
