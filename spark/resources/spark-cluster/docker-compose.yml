services:

  # ============================================================
  #  BASE DE DATOS - MySQL (Hive Metastore)
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: hive_metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: hivepass
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - spark-net

  # ============================================================
  #  ALMACENAMIENTO - MinIO (compatible S3)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'   # API S3
      - '9001:9001'   # Consola web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spark-net

  # Crea buckets iniciales al arrancar
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/warehouse &&
        mc mb --ignore-existing local/raw-data &&
        mc mb --ignore-existing local/processed &&
        echo '>>> Buckets creados correctamente'
      "
    networks:
      - spark-net

  # ============================================================
  #  STREAMING - Kafka (con KRaft, sin Zookeeper)
  # ============================================================
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    environment:
      # Modo KRaft (sin Zookeeper)
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      # Listeners
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Configuracion general
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
    ports:
      - '9094:9094'   # Acceso externo
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - spark-net

  # UI para Kafka (opcional pero muy util)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - '8081:8080'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - spark-net

  # ============================================================
  #  SPARK 4 - Master
  # ============================================================
  spark-master:
    image: bitnami/spark:latest 
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - '8080:8080'   # Spark Master UI
      - '7077:7077'   # Spark master
    volumes:
      - ./jars:/opt/bitnami/spark/extra-jars
      - ./spark-config/hive-site.xml:/opt/bitnami/spark/conf/hive-site.xml
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - spark-net

  # ============================================================
  #  SPARK 4 - Workers
  # ============================================================
  spark-worker-1:
    image: bitnami/spark:latest 
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./jars:/opt/bitnami/spark/extra-jars
      - ./spark-config/hive-site.xml:/opt/bitnami/spark/conf/hive-site.xml
    depends_on:
      - spark-master
    networks:
      - spark-net

  spark-worker-2:
    image: bitnami/spark:latest 
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    volumes:
      - ./jars:/opt/bitnami/spark/extra-jars
      - ./spark-config/hive-site.xml:/opt/bitnami/spark/conf/hive-site.xml
    depends_on:
      - spark-master
    networks:
      - spark-net

  # ============================================================
  #  JUPYTER - Notebooks con PySpark (Spark 4)
  #  Imagen migrada de Docker Hub a Quay.io
  # ============================================================
  jupyter:
    image: quay.io/jupyter/all-spark-notebook:latest
    container_name: jupyter
    ports:
      - '8888:8888'
      - '4040:4040'   # Spark UI del driver
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=spark
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark-config/hive-site.xml:/usr/local/spark/conf/hive-site.xml
      - ./jars:/usr/local/spark/extra-jars
    depends_on:
      - spark-master
      - mysql
      - minio
      - kafka
    networks:
      - spark-net

# ============================================================
#  VOLUMES & NETWORK
# ============================================================
volumes:
  mysql_data:
  minio_data:
  kafka_data:

networks:
  spark-net:
    driver: bridge
