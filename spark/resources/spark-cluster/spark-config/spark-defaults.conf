# ============================================================
# Spark defaults - se carga automaticamente al crear SparkSession
# ============================================================

# --- Cluster ---
spark.master                                spark://iabd-spark-master:7077
spark.app.name                              spark4-cluster

# --- Hive Metastore (MySQL) ---
spark.sql.catalogImplementation             hive
spark.sql.warehouse.dir                     s3a://warehouse/hive
spark.hadoop.javax.jdo.option.ConnectionURL jdbc:mysql://iabd-mysql:3306/hive_metastore?useSSL=false&allowPublicKeyRetrieval=true
spark.hadoop.javax.jdo.option.ConnectionDriverName  com.mysql.cj.jdbc.Driver
spark.hadoop.javax.jdo.option.ConnectionUserName    hive
spark.hadoop.javax.jdo.option.ConnectionPassword    hivepass
spark.hadoop.hive.metastore.schema.verification             false
spark.hadoop.hive.metastore.schema.verification.record.version  false
spark.hadoop.datanucleus.schema.autoCreateAll       false
spark.hadoop.datanucleus.autoCreateSchema            false
spark.hadoop.datanucleus.fixedDatastore              true
spark.hadoop.datanucleus.schema.autoCreateTables     false
spark.hadoop.datanucleus.schema.validateTables       false
spark.hadoop.datanucleus.schema.validateConstraints  false
spark.hadoop.datanucleus.schema.validateColumns      false

# --- Classpath (extra jars) ---
spark.driver.extraClassPath     /opt/spark/extra-jars/*
spark.executor.extraClassPath   /opt/spark/extra-jars/*

# --- MinIO / S3A ---
spark.hadoop.fs.s3a.endpoint                http://iabd-minio:9000
spark.hadoop.fs.s3a.access.key              minioadmin
spark.hadoop.fs.s3a.secret.key              minioadmin123
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.impl                    org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled  false

# --- Recursos ---
spark.executor.memory           2g
spark.driver.memory             2g
spark.network.timeout           300s
spark.executor.heartbeatInterval 60s
