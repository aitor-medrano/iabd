# Catálogo "hive" de Trino: conector Hive apuntando al Metastore y a HDFS.
connector.name=hive

# Metastore Thrift de Hive
hive.metastore=thrift
hive.metastore.uri=thrift://hive-metastore:9083

# Soporte de sistema de ficheros Hadoop/HDFS (Trino >= 481)
fs.hadoop.enabled=true

# Recursos de configuración Hadoop para el cliente HDFS de Trino
hive.config.resources=/etc/hadoop/core-site.xml,/etc/hadoop/hdfs-site.xml

# Permitir escrituras sobre tablas externas (para el CREATE TABLE ... external_location)
hive.non-managed-table-writes-enabled=true

# En un entorno de aula conviene no cachear el metastore para ver los cambios al instante
hive.metastore-cache-ttl=0s