<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Dimensiones que cambian lentamente (SCD)</text>
  <text x="360" y="48" text-anchor="middle" font-size="12" fill="#64748b">el cliente 100 se muda de Valencia a Alicante en jul. 2024</text>

  <!-- ============ SCD 1 ============ -->
  <text x="40" y="82" font-size="13" font-weight="700" fill="#b91c1c">SCD 1 · sobrescribe</text>
  <text x="185" y="82" font-size="11" fill="#94a3b8">se pierde el histórico</text>

  <!-- cabecera -->
  <rect x="40" y="92" width="90" height="26" fill="#eef2f7" stroke="#cbd5e1"/>
  <rect x="130" y="92" width="120" height="26" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="85" y="109" text-anchor="middle" font-size="11" fill="#334155">cliente_id</text>
  <text x="190" y="109" text-anchor="middle" font-size="11" fill="#334155">provincia</text>
  <!-- fila -->
  <rect x="40" y="118" width="90" height="28" fill="#fff" stroke="#e2e8f0"/>
  <rect x="130" y="118" width="120" height="28" fill="#fff" stroke="#e2e8f0"/>
  <text x="85" y="137" text-anchor="middle" font-size="11.5" fill="#334155">100</text>
  <text x="190" y="137" text-anchor="middle" font-size="11.5" fill="#334155">Alicante</text>
  <text x="270" y="137" font-size="11" fill="#94a3b8">← antes «Valencia» (perdido)</text>

  <!-- separador -->
  <line x1="40" y1="176" x2="680" y2="176" stroke="#e2e8f0"/>

  <!-- ============ SCD 2 ============ -->
  <text x="40" y="204" font-size="13" font-weight="700" fill="#065f46">SCD 2 · versiona</text>
  <text x="175" y="204" font-size="11" fill="#94a3b8">conserva el histórico con clave subrogada y vigencia</text>

  <!-- cabecera -->
  <g font-size="10.5" fill="#334155">
    <rect x="40"  y="214" width="60"  height="26" fill="#eef2f7" stroke="#cbd5e1"/><text x="70"  y="231" text-anchor="middle">clave_sk</text>
    <rect x="100" y="214" width="70"  height="26" fill="#eef2f7" stroke="#cbd5e1"/><text x="135" y="231" text-anchor="middle">cliente_id</text>
    <rect x="170" y="214" width="90"  height="26" fill="#eef2f7" stroke="#cbd5e1"/><text x="215" y="231" text-anchor="middle">provincia</text>
    <rect x="260" y="214" width="110" height="26" fill="#eef2f7" stroke="#cbd5e1"/><text x="315" y="231" text-anchor="middle">valido_desde</text>
    <rect x="370" y="214" width="110" height="26" fill="#eef2f7" stroke="#cbd5e1"/><text x="425" y="231" text-anchor="middle">valido_hasta</text>
    <rect x="480" y="214" width="60"  height="26" fill="#eef2f7" stroke="#cbd5e1"/><text x="510" y="231" text-anchor="middle">actual</text>
  </g>

  <!-- fila 1: versión antigua -->
  <g font-size="10.5" fill="#64748b">
    <rect x="40"  y="240" width="60"  height="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="70"  y="258" text-anchor="middle">1</text>
    <rect x="100" y="240" width="70"  height="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="135" y="258" text-anchor="middle">100</text>
    <rect x="170" y="240" width="90"  height="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="215" y="258" text-anchor="middle">Valencia</text>
    <rect x="260" y="240" width="110" height="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="315" y="258" text-anchor="middle">2023-01-01</text>
    <rect x="370" y="240" width="110" height="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="425" y="258" text-anchor="middle">2024-06-30</text>
    <rect x="480" y="240" width="60"  height="28" fill="#f8fafc" stroke="#e2e8f0"/><text x="510" y="258" text-anchor="middle">✗</text>
  </g>
  <text x="556" y="258" font-size="10" fill="#94a3b8">versión histórica</text>

  <!-- fila 2: versión actual -->
  <g font-size="10.5" fill="#065f46" font-weight="600">
    <rect x="40"  y="268" width="60"  height="28" fill="#ecfdf5" stroke="#10b981"/><text x="70"  y="286" text-anchor="middle">2</text>
    <rect x="100" y="268" width="70"  height="28" fill="#ecfdf5" stroke="#10b981"/><text x="135" y="286" text-anchor="middle">100</text>
    <rect x="170" y="268" width="90"  height="28" fill="#ecfdf5" stroke="#10b981"/><text x="215" y="286" text-anchor="middle">Alicante</text>
    <rect x="260" y="268" width="110" height="28" fill="#ecfdf5" stroke="#10b981"/><text x="315" y="286" text-anchor="middle">2024-07-01</text>
    <rect x="370" y="268" width="110" height="28" fill="#ecfdf5" stroke="#10b981"/><text x="425" y="286" text-anchor="middle">9999-12-31</text>
    <rect x="480" y="268" width="60"  height="28" fill="#ecfdf5" stroke="#10b981"/><text x="510" y="286" text-anchor="middle">✓</text>
  </g>
  <text x="556" y="286" font-size="10" fill="#059669">versión actual</text>

  <text x="40" y="330" font-size="11" fill="#334155">Una venta de mayo 2024 apunta a <tspan font-weight="700" fill="#334155">clave_sk = 1</tspan> (Valencia); una de agosto, a <tspan font-weight="700" fill="#065f46">clave_sk = 2</tspan> (Alicante).</text>
  <text x="40" y="350" font-size="11" fill="#64748b">Así cada hecho queda ligado a la versión del cliente vigente en el momento en que ocurrió.</text>
</svg>
