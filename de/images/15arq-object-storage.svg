<svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="390" fill="#ffffff"/>

  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1565C0"/>
    </marker>
    <marker id="abs" markerWidth="10" markerHeight="10" refX="0" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="#1565C0"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#9E9E9E"/>
    </marker>
  </defs>

  <!-- DuckDB engine (in-process) -->
  <rect x="40" y="140" width="184" height="96" rx="8" fill="#6A1B9A"/>
  <text x="132" y="178" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">DuckDB</text>
  <text x="132" y="200" text-anchor="middle" fill="#E1BEE7" font-size="11.5">motor in-process (sin clúster)</text>
  <text x="132" y="217" text-anchor="middle" fill="#E1BEE7" font-size="11.5">extensión httpfs</text>

  <!-- MinIO -->
  <rect x="470" y="78" width="250" height="224" rx="10" fill="#FBE9E7" stroke="#C0392B" stroke-width="1.6"/>
  <text x="595" y="106" text-anchor="middle" fill="#C0392B" font-size="15" font-weight="bold">iabd-de-minio</text>
  <text x="595" y="125" text-anchor="middle" fill="#C0392B" font-size="11.5">API :9000 &#183; consola :9001</text>
  <rect x="492" y="146" width="206" height="40" rx="6" fill="#C0392B"/>
  <text x="595" y="171" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">raw-data  (bronze)</text>
  <rect x="492" y="192" width="206" height="40" rx="6" fill="#C0392B"/>
  <text x="595" y="217" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">processed  (silver)</text>
  <rect x="492" y="238" width="206" height="40" rx="6" fill="#C0392B"/>
  <text x="595" y="263" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">warehouse  (Hive)</text>

  <!-- s3:// arrow DuckDB <-> MinIO -->
  <line x1="226" y1="188" x2="468" y2="188" stroke="#1565C0" stroke-width="2.6" marker-end="url(#ab)" marker-start="url(#abs)"/>
  <rect x="303" y="166" width="88" height="24" rx="4" fill="#ffffff"/>
  <text x="347" y="184" text-anchor="middle" fill="#1565C0" font-size="15" font-weight="bold">s3://</text>
  <text x="347" y="208" text-anchor="middle" fill="#546E7A" font-size="10.5">read_csv / COPY … TO</text>

  <!-- minio-init one-shot -->
  <rect x="470" y="318" width="250" height="54" rx="8" fill="#FAFAFA" stroke="#9E9E9E" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="595" y="341" text-anchor="middle" fill="#616161" font-size="12.5" font-weight="bold">iabd-de-minio-init  (one-shot)</text>
  <text x="595" y="360" text-anchor="middle" fill="#757575" font-size="11">mc mb --ignore-existing</text>
  <line x1="595" y1="316" x2="595" y2="303" stroke="#9E9E9E" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ag)"/>
  <text x="607" y="313" fill="#757575" font-size="10.5">crea los buckets</text>

  <!-- legend -->
  <text x="40" y="300" fill="#455A64" font-size="12" font-weight="bold">Leyenda</text>
  <rect x="40" y="310" width="14" height="14" rx="3" fill="#6A1B9A"/>
  <text x="60" y="322" fill="#546E7A" font-size="11">motor de cómputo (DuckDB)</text>
  <rect x="40" y="330" width="14" height="14" rx="3" fill="#C0392B"/>
  <text x="60" y="342" fill="#546E7A" font-size="11">object storage (MinIO)</text>
  <rect x="40" y="350" width="14" height="14" rx="3" fill="#FAFAFA" stroke="#9E9E9E" stroke-dasharray="3 2"/>
  <text x="60" y="362" fill="#546E7A" font-size="11">contenedor one-shot</text>
  <line x1="40" y1="373" x2="66" y2="373" stroke="#1565C0" stroke-width="2.6"/>
  <text x="72" y="377" fill="#546E7A" font-size="11">acceso a datos (s3://)</text>
</svg>
