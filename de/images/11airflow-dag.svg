<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <!--
    Paleta del bloque:
      #4f8a6d verde (Airflow / orquestación)
      #eef6f1 verde claro (relleno de tareas)
      #2b3a42 oscuro (texto)
      #8a8f98 gris (dependencias)
  -->
  <defs>
    <marker id="fg" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect width="400" height="220" fill="#ffffff"/>

  <!-- Dependencias -->
  <path d="M 96 92 C 110 62, 125 48, 148 46" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#fg)"/>
  <path d="M 96 128 C 110 158, 125 172, 148 174" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#fg)"/>
  <path d="M 222 46 C 245 48, 262 62, 276 90" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#fg)"/>
  <path d="M 222 174 C 245 172, 262 158, 276 130" fill="none" stroke="#8a8f98" stroke-width="2" marker-end="url(#fg)"/>

  <!-- Tareas -->
  <rect x="24" y="80" width="72" height="60" rx="10" fill="#eef6f1" stroke="#4f8a6d" stroke-width="2.5"/>
  <text x="60" y="117" text-anchor="middle" font-size="20" font-weight="600" fill="#2b3a42">A</text>

  <rect x="150" y="16" width="72" height="60" rx="10" fill="#eef6f1" stroke="#4f8a6d" stroke-width="2.5"/>
  <text x="186" y="53" text-anchor="middle" font-size="20" font-weight="600" fill="#2b3a42">B</text>

  <rect x="150" y="144" width="72" height="60" rx="10" fill="#eef6f1" stroke="#4f8a6d" stroke-width="2.5"/>
  <text x="186" y="181" text-anchor="middle" font-size="20" font-weight="600" fill="#2b3a42">C</text>

  <rect x="278" y="80" width="72" height="60" rx="10" fill="#eef6f1" stroke="#4f8a6d" stroke-width="2.5"/>
  <text x="314" y="117" text-anchor="middle" font-size="20" font-weight="600" fill="#2b3a42">D</text>
</svg>
