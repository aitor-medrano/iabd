<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <!--
    Paleta del bloque:
      #2b3a42 oscuro (metadatos, usuario, numeración)
      #4f8a6d verde (componentes de Airflow)
      #eef6f1 verde claro (piezas internas)
      #c0603f terracota (ficheros y datos)
      #2f6fed azul (flechas de datos)
      #8a8f98 gris (flechas de control, discontinuas; componentes opcionales)
  -->
  <defs>
    <marker id="fa" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2f6fed"/>
    </marker>
    <marker id="fg" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect width="940" height="540" fill="#ffffff"/>

  <!-- ===== Flechas (debajo de las cajas) ===== -->
  <!-- usuario -> API server -->
  <line x1="210" y1="65" x2="338" y2="65" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <!-- API server -> BD -->
  <line x1="350" y1="100" x2="214" y2="200" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <!-- scheduler <-> BD -->
  <line x1="340" y1="255" x2="214" y2="255" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <!-- DAG processor -> BD -->
  <line x1="350" y1="410" x2="214" y2="312" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <!-- carpeta -> DAG processor -->
  <line x1="210" y1="445" x2="338" y2="445" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <!-- executor -> workers -->
  <line x1="566" y1="270" x2="688" y2="270" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <text x="628" y="260" text-anchor="middle" font-size="11" fill="#5f6670">envía tareas</text>
  <!-- workers -> API server -->
  <path d="M 760 200 C 740 130, 680 85, 582 72" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <text x="690" y="104" font-size="11" fill="#5f6670">estado y logs</text>
  <!-- carpeta -> workers (código de las tareas) -->
  <path d="M 115 475 L 115 512 L 650 512 L 650 300 L 688 300" fill="none" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fg)"/>
  <text x="390" y="528" text-anchor="middle" font-size="11" fill="#5f6670">los workers cargan el código de cada tarea</text>
  <!-- workers -> datos -->
  <line x1="800" y1="340" x2="800" y2="408" stroke="#2f6fed" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="810" y="378" font-size="11" fill="#2f6fed">leen y escriben</text>

  <!-- ===== Cajas ===== -->
  <!-- Usuario -->
  <rect x="30" y="38" width="180" height="56" rx="8" fill="#ffffff" stroke="#2b3a42" stroke-width="2"/>
  <text x="120" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#2b3a42">Usuario</text>
  <text x="120" y="80" text-anchor="middle" font-size="12" fill="#2b3a42">navegador · CLI</text>

  <!-- Base de metadatos -->
  <rect x="30" y="200" width="180" height="110" rx="10" fill="#2b3a42"/>
  <text x="120" y="248" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Base de metadatos</text>
  <text x="120" y="268" text-anchor="middle" font-size="12" fill="#ffffff">DAG, ejecuciones</text>
  <text x="120" y="284" text-anchor="middle" font-size="12" fill="#ffffff">y estados</text>

  <!-- Carpeta de DAG -->
  <rect x="30" y="415" width="180" height="60" rx="8" fill="#ffffff" stroke="#c0603f" stroke-width="2"/>
  <text x="120" y="441" text-anchor="middle" font-size="14" font-weight="600" fill="#c0603f">Carpeta de DAG</text>
  <text x="120" y="460" text-anchor="middle" font-size="12" fill="#c0603f">ficheros .py</text>

  <!-- API server -->
  <rect x="340" y="30" width="240" height="76" rx="10" fill="#4f8a6d"/>
  <text x="460" y="58" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">API server</text>
  <text x="460" y="78" text-anchor="middle" font-size="12" fill="#ffffff">interfaz web · API REST</text>
  <text x="460" y="94" text-anchor="middle" font-size="12" fill="#ffffff">Execution API</text>

  <!-- Scheduler con executor dentro -->
  <rect x="340" y="190" width="240" height="130" rx="10" fill="#4f8a6d"/>
  <text x="460" y="216" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Scheduler</text>
  <text x="460" y="234" text-anchor="middle" font-size="12" fill="#ffffff">decide qué se ejecuta y cuándo</text>
  <rect x="360" y="248" width="200" height="54" rx="8" fill="#eef6f1"/>
  <text x="460" y="271" text-anchor="middle" font-size="14" font-weight="600" fill="#2b3a42">Executor</text>
  <text x="460" y="289" text-anchor="middle" font-size="11" fill="#2b3a42">cómo y dónde se lanzan</text>

  <!-- DAG processor -->
  <rect x="340" y="410" width="240" height="70" rx="10" fill="#4f8a6d"/>
  <text x="460" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">DAG processor</text>
  <text x="460" y="460" text-anchor="middle" font-size="12" fill="#ffffff">lee y serializa los DAG</text>

  <!-- Workers -->
  <rect x="690" y="200" width="220" height="140" rx="10" fill="#4f8a6d"/>
  <text x="800" y="226" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Workers</text>
  <text x="800" y="244" text-anchor="middle" font-size="12" fill="#ffffff">ejecutan las tareas</text>
  <rect x="708" y="258" width="88" height="62" rx="8" fill="#eef6f1"/>
  <text x="752" y="294" text-anchor="middle" font-size="13" fill="#2b3a42">tarea</text>
  <rect x="804" y="258" width="88" height="62" rx="8" fill="#eef6f1"/>
  <text x="848" y="294" text-anchor="middle" font-size="13" fill="#2b3a42">tarea</text>

  <!-- Datos -->
  <rect x="690" y="410" width="220" height="60" rx="8" fill="#ffffff" stroke="#c0603f" stroke-width="2"/>
  <text x="800" y="436" text-anchor="middle" font-size="14" font-weight="600" fill="#c0603f">Sistemas de datos</text>
  <text x="800" y="455" text-anchor="middle" font-size="12" fill="#c0603f">MySQL · DuckDB · MinIO</text>

  <!-- Triggerer (opcional) -->
  <rect x="690" y="30" width="220" height="56" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="54" text-anchor="middle" font-size="14" font-weight="600" fill="#5f6670">Triggerer (opcional)</text>
  <text x="800" y="72" text-anchor="middle" font-size="11" fill="#5f6670">vigila las tareas diferibles</text>

  <!-- ===== Pasos ===== -->
  <circle cx="274" cy="429" r="11" fill="#2b3a42"/><text x="274" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <circle cx="268" cy="378" r="11" fill="#2b3a42"/><text x="268" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <circle cx="277" cy="239" r="11" fill="#2b3a42"/><text x="277" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <circle cx="628" cy="236" r="11" fill="#2b3a42"/><text x="628" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <circle cx="672" cy="132" r="11" fill="#2b3a42"/><text x="672" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <circle cx="274" cy="49" r="11" fill="#2b3a42"/><text x="274" y="53" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
</svg>
