<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="440" fill="#ffffff"/>

  <!-- ============ PANEL IZQUIERDO: ALMACENAMIENTO POR FILAS ============ -->
  <rect x="20" y="20" width="470" height="40" fill="#37474f"/>
  <text x="255" y="47" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Almacenamiento por filas</text>

  <!-- Fila 1 -->
  <rect x="20"  y="60"  width="110" height="90" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="75"  y="110" text-anchor="middle" fill="#37474f" font-size="14">Fila 1</text>
  <rect x="130" y="60"  width="360" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="90"  width="360" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="120" width="360" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="142" y="80"  fill="#1565c0" font-size="13">1</text>
  <text x="142" y="110" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <text x="142" y="140" fill="#6a1b9a" font-size="13">CLOSED</text>
  <rect x="20" y="60" width="470" height="90" fill="none" stroke="#546e7a" stroke-width="2"/>

  <!-- Fila 2 -->
  <rect x="20"  y="150" width="110" height="90" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="75"  y="200" text-anchor="middle" fill="#37474f" font-size="14">Fila 2</text>
  <rect x="130" y="150" width="360" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="180" width="360" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="210" width="360" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="142" y="170" fill="#1565c0" font-size="13">2</text>
  <text x="142" y="200" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <text x="142" y="230" fill="#6a1b9a" font-size="13">PENDING_PAYMENT</text>
  <rect x="20" y="150" width="470" height="90" fill="none" stroke="#546e7a" stroke-width="2"/>

  <!-- Fila 3 -->
  <rect x="20"  y="240" width="110" height="90" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="75"  y="290" text-anchor="middle" fill="#37474f" font-size="14">Fila 3</text>
  <rect x="130" y="240" width="360" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="270" width="360" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="300" width="360" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="142" y="260" fill="#1565c0" font-size="13">3</text>
  <text x="142" y="290" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <text x="142" y="320" fill="#6a1b9a" font-size="13">COMPLETE</text>
  <rect x="20" y="240" width="470" height="90" fill="none" stroke="#546e7a" stroke-width="2"/>

  <!-- Fila 4 -->
  <rect x="20"  y="330" width="110" height="90" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="75"  y="380" text-anchor="middle" fill="#37474f" font-size="14">Fila 4</text>
  <rect x="130" y="330" width="360" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="360" width="360" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="130" y="390" width="360" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="142" y="350" fill="#1565c0" font-size="13">4</text>
  <text x="142" y="380" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <text x="142" y="410" fill="#6a1b9a" font-size="13">CLOSED</text>
  <rect x="20" y="330" width="470" height="90" fill="none" stroke="#546e7a" stroke-width="2"/>

  <!-- ============ PANEL DERECHO: ALMACENAMIENTO POR COLUMNAS ============ -->
  <rect x="510" y="20" width="470" height="40" fill="#37474f"/>
  <text x="745" y="47" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">Almacenamiento por columnas</text>

  <!-- order_id -->
  <rect x="510" y="60"  width="160" height="120" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="590" y="125" text-anchor="middle" fill="#1565c0" font-size="14" font-family="monospace">order_id</text>
  <rect x="670" y="60"  width="310" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="90"  width="310" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="120" width="310" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="150" width="310" height="30" fill="#e3f2fd" stroke="#90a4ae" stroke-width="1"/>
  <text x="682" y="80"  fill="#1565c0" font-size="13">1</text>
  <text x="682" y="110" fill="#1565c0" font-size="13">2</text>
  <text x="682" y="140" fill="#1565c0" font-size="13">3</text>
  <text x="682" y="170" fill="#1565c0" font-size="13">4</text>
  <rect x="510" y="60" width="470" height="120" fill="none" stroke="#546e7a" stroke-width="2"/>

  <!-- order_date -->
  <rect x="510" y="180" width="160" height="120" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="590" y="245" text-anchor="middle" fill="#ef6c00" font-size="14" font-family="monospace">order_date</text>
  <rect x="670" y="180" width="310" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="210" width="310" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="240" width="310" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="270" width="310" height="30" fill="#fff8e1" stroke="#90a4ae" stroke-width="1"/>
  <text x="682" y="200" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <text x="682" y="230" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <text x="682" y="260" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <text x="682" y="290" fill="#ef6c00" font-size="13">2013-07-25 00:00:00.0</text>
  <rect x="510" y="180" width="470" height="120" fill="none" stroke="#546e7a" stroke-width="2"/>

  <!-- order_status -->
  <rect x="510" y="300" width="160" height="120" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/>
  <text x="590" y="365" text-anchor="middle" fill="#6a1b9a" font-size="14" font-family="monospace">order_status</text>
  <rect x="670" y="300" width="310" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="330" width="310" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="360" width="310" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <rect x="670" y="390" width="310" height="30" fill="#f3e5f5" stroke="#90a4ae" stroke-width="1"/>
  <text x="682" y="320" fill="#6a1b9a" font-size="13">CLOSED</text>
  <text x="682" y="350" fill="#6a1b9a" font-size="13">PENDING_PAYMENT</text>
  <text x="682" y="380" fill="#6a1b9a" font-size="13">COMPLETE</text>
  <text x="682" y="410" fill="#6a1b9a" font-size="13">CLOSED</text>
  <rect x="510" y="300" width="470" height="120" fill="none" stroke="#546e7a" stroke-width="2"/>
</svg>
