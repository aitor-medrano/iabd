<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Helvetica, Arial, sans-serif">
<!--
  Paleta (IABD):
    #37474F  control / coordinador
    #2F6F6A  motores de cómputo        (sec. #C5E2DE, borde #24564F)
    #8A6D2A  catálogo / metastore      (sec. #EEE1C2, borde #6B5320)
    #A9634E  object storage            (sec. #F2DED6, borde #874C3A)
    #2C6FB5  flechas de acceso a datos
    #78909C  gris (implícito, punteado)
-->
  <defs>
    <marker id="tm-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="tm-dark-start" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M12,0 L0,5 L12,10 z" fill="#37474F"/>
    </marker>
    <marker id="tm-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#2C6FB5"/>
    </marker>
    <marker id="tm-teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#8A6D2A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" fill="#FFFFFF"/>

  <!-- Cliente -->
  <rect x="24" y="46" width="150" height="62" rx="6" fill="#FFFFFF" stroke="#37474F" stroke-width="1.8"/>
  <text x="99" y="72" font-size="13" font-weight="bold" fill="#37474F" text-anchor="middle">Cliente</text>
  <text x="99" y="90" font-size="10" fill="#546E7A" text-anchor="middle">trino CLI · JDBC · UI :8083</text>

  <!-- Coordinador -->
  <rect x="270" y="34" width="240" height="88" rx="6" fill="#37474F" stroke="#000000" stroke-width="1.5"/>
  <text x="390" y="60" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">coordinator</text>
  <text x="390" y="79" font-size="10" fill="#B0BEC5" text-anchor="middle">parsea · optimiza · planifica</text>
  <text x="390" y="94" font-size="10" fill="#B0BEC5" text-anchor="middle">trocea en stages y reparte splits</text>
  <text x="390" y="111" font-size="10" font-style="italic" fill="#E3D2A6" text-anchor="middle">no lee ni un byte de datos</text>

  <!-- Hive Metastore -->
  <rect x="620" y="40" width="230" height="76" rx="6" fill="#8A6D2A" stroke="#6B5320" stroke-width="1.5"/>
  <text x="735" y="65" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">iabd-hive-metastore</text>
  <text x="735" y="83" font-size="10" fill="#EEE1C2" text-anchor="middle">thrift :9083</text>
  <text x="735" y="99" font-size="10" fill="#EEE1C2" text-anchor="middle">esquema · ruta · particiones</text>

  <!-- Workers -->
  <rect x="90" y="218" width="180" height="86" rx="6" fill="#2F6F6A" stroke="#24564F" stroke-width="1.5"/>
  <text x="180" y="244" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">worker 1</text>
  <text x="180" y="264" font-size="10" fill="#C5E2DE" text-anchor="middle">ejecuta tasks</text>
  <text x="180" y="280" font-size="10" fill="#C5E2DE" text-anchor="middle">todo en memoria</text>
  <text x="180" y="296" font-size="10" fill="#C5E2DE" text-anchor="middle">y en flujo</text>

  <rect x="345" y="218" width="180" height="86" rx="6" fill="#2F6F6A" stroke="#24564F" stroke-width="1.5"/>
  <text x="435" y="244" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">worker 2</text>
  <text x="435" y="264" font-size="10" fill="#C5E2DE" text-anchor="middle">ejecuta tasks</text>
  <text x="435" y="280" font-size="10" fill="#C5E2DE" text-anchor="middle">todo en memoria</text>
  <text x="435" y="296" font-size="10" fill="#C5E2DE" text-anchor="middle">y en flujo</text>

  <rect x="600" y="218" width="180" height="86" rx="6" fill="#2F6F6A" stroke="#24564F" stroke-width="1.5"/>
  <text x="690" y="244" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">worker 3</text>
  <text x="690" y="264" font-size="10" fill="#C5E2DE" text-anchor="middle">ejecuta tasks</text>
  <text x="690" y="280" font-size="10" fill="#C5E2DE" text-anchor="middle">todo en memoria</text>
  <text x="690" y="296" font-size="10" fill="#C5E2DE" text-anchor="middle">y en flujo</text>

  <!-- MinIO -->
  <rect x="90" y="410" width="690" height="94" rx="6" fill="#A9634E" stroke="#874C3A" stroke-width="1.5"/>
  <text x="435" y="436" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">iabd-minio:9000 — s3://processed/retail_db/orders/</text>
  <rect x="115" y="450" width="130" height="38" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#F2DED6"/>
  <text x="180" y="466" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">split</text>
  <text x="180" y="480" font-size="9" fill="#F2DED6" text-anchor="middle">row groups 0-3</text>
  <rect x="370" y="450" width="130" height="38" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#F2DED6"/>
  <text x="435" y="466" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">split</text>
  <text x="435" y="480" font-size="9" fill="#F2DED6" text-anchor="middle">row groups 4-7</text>
  <rect x="625" y="450" width="130" height="38" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#F2DED6"/>
  <text x="690" y="466" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">split</text>
  <text x="690" y="480" font-size="9" fill="#F2DED6" text-anchor="middle">row groups 8-11</text>

  <!-- Cliente -> coordinador -->
  <path d="M174,74 L266,74" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#tm-dark)"/>
  <text x="180" y="66" font-size="10" fill="#37474F">SQL</text>

  <!-- coordinador -> metastore -->
  <path d="M510,78 L616,78" stroke="#8A6D2A" stroke-width="1.8" fill="none" marker-end="url(#tm-teal)"/>
  <text x="518" y="70" font-size="10" fill="#8A6D2A">1. ¿dónde está la tabla</text>
  <text x="518" y="95" font-size="10" fill="#8A6D2A">y qué particiones tiene?</text>

  <!-- coordinador -> workers -->
  <path d="M340,122 L340,175 L180,175 L180,214" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#tm-dark)"/>
  <path d="M390,122 L390,175 L435,175 L435,214" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#tm-dark)"/>
  <path d="M440,122 L440,175 L690,175 L690,214" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#tm-dark)"/>
  <text x="452" y="168" font-size="10" fill="#37474F">2. tasks + splits asignados</text>

  <!-- workers -> minio -->
  <path d="M180,304 L180,406" stroke="#2C6FB5" stroke-width="2.2" fill="none" marker-end="url(#tm-blue)"/>
  <path d="M435,304 L435,406" stroke="#2C6FB5" stroke-width="2.2" fill="none" marker-end="url(#tm-blue)"/>
  <path d="M690,304 L690,406" stroke="#2C6FB5" stroke-width="2.2" fill="none" marker-end="url(#tm-blue)"/>
  <text x="188" y="380" font-size="10" fill="#2C6FB5">3. cada worker lee solo su trozo</text>

  <!-- exchange -->
  <path d="M278,261 L337,261" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#tm-dark)" marker-start="url(#tm-dark-start)"/>
  <path d="M533,261 L592,261" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#tm-dark)" marker-start="url(#tm-dark-start)"/>
  <text x="278" y="332" font-size="10" fill="#37474F">4. exchange: redistribuyen filas entre sí (por la clave del GROUP BY o del JOIN)</text>

  <!-- resultado -->
  <path d="M266,100 L174,100" stroke="#2C6FB5" stroke-width="2.2" fill="none" marker-end="url(#tm-blue)"/>
  <text x="180" y="118" font-size="10" fill="#2C6FB5">5. resultado</text>

  <!-- leyenda -->
  <line x1="90" y1="536" x2="122" y2="536" stroke="#37474F" stroke-width="1.8" marker-end="url(#tm-dark)"/>
  <text x="132" y="540" font-size="10" fill="#546E7A">control y planificación</text>

  <line x1="300" y1="536" x2="332" y2="536" stroke="#2C6FB5" stroke-width="2.2" marker-end="url(#tm-blue)"/>
  <text x="342" y="540" font-size="10" fill="#546E7A">acceso a datos</text>

  <line x1="490" y1="536" x2="522" y2="536" stroke="#8A6D2A" stroke-width="1.8" marker-end="url(#tm-teal)"/>
  <text x="532" y="540" font-size="10" fill="#546E7A">metadatos (catálogo)</text>

  <text x="700" y="540" font-size="10" font-style="italic" fill="#90A4AE">nada toca el disco: si no cabe, falla</text>
</svg>
