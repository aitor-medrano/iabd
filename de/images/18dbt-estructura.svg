<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 516" font-family="'Segoe UI', Roboto, sans-serif" role="img" aria-label="Estructura de carpetas de un proyecto dbt: staging, intermediate y marts, con su prefijo, materialización y función de lectura">
  <!--
    Paleta IABD:
      #2b3a42  oscuro    -> títulos y texto principal
      #3fa39b  teal      -> capa staging
      #c0603f  terracota -> capa intermediate
      #7d5ba6  púrpura   -> capa marts
      #2f6fed  azul      -> acentos (source() / ref())
    Fondo de tarjeta explícito (#ffffff) para que la figura se lea igual
    en el tema claro y en el oscuro de Material.
    Texto blanco sobre color: sólo en negrita >=15px (contraste AA para texto grande).
  -->
  <rect x="0" y="0" width="860" height="516" rx="10" fill="#ffffff"/>

  <text x="20" y="32" font-size="17" font-weight="700" fill="#2b3a42">Estructura de models/ en un proyecto dbt</text>
  <text x="20" y="52" font-size="12.5" fill="#5a6b73">Cada capa tiene su carpeta, su prefijo, su materialización y lo que se le permite hacer.</text>

  <!-- Cabeceras de columna -->
  <text x="258" y="80" font-size="11" font-weight="700" fill="#5a6b73" letter-spacing="0.5">QUÉ SE HACE AQUÍ</text>
  <text x="596" y="80" font-size="11" font-weight="700" fill="#5a6b73" letter-spacing="0.5">CÓMO</text>
  <text x="736" y="80" font-size="11" font-weight="700" fill="#5a6b73" letter-spacing="0.5">EN EL PROYECTO</text>

  <!-- ===================== STAGING ===================== -->
  <rect x="20" y="90" width="820" height="104" rx="8" fill="#f4f6f7"/>
  <path d="M20 98 a8 8 0 0 1 8-8 h204 v104 h-204 a8 8 0 0 1 -8-8 z" fill="#3fa39b"/>
  <text x="38" y="122" font-size="15" font-weight="700" fill="#ffffff">models/staging/</text>
  <rect x="38" y="136" width="56" height="22" rx="11" fill="#ffffff"/>
  <text x="66" y="151" font-size="12.5" font-weight="700" fill="#3fa39b" text-anchor="middle">stg_</text>
  <text x="38" y="176" font-size="11.5" fill="#ffffff">7 modelos</text>

  <text x="258" y="118" font-size="12.5" fill="#2b3a42">Una vista por tabla origen. Renombrar columnas al</text>
  <text x="258" y="136" font-size="12.5" fill="#2b3a42">vocabulario del proyecto, castear tipos, estandarizar.</text>
  <text x="258" y="158" font-size="12.5" font-weight="600" fill="#c0603f">Sin joins ni agregaciones.</text>

  <rect x="596" y="104" width="62" height="24" rx="6" fill="#3fa39b"/>
  <text x="627" y="120" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">view</text>
  <text x="596" y="148" font-size="11.5" fill="#5a6b73">lee con</text>
  <text x="596" y="166" font-size="13" font-weight="700" fill="#2f6fed">source()</text>

  <text x="736" y="120" font-size="12" fill="#2b3a42">stg_orders</text>
  <text x="736" y="140" font-size="12" fill="#2b3a42">stg_order_items</text>
  <text x="736" y="160" font-size="12" fill="#2b3a42">stg_devoluciones…</text>

  <!-- ===================== INTERMEDIATE ===================== -->
  <rect x="20" y="204" width="820" height="104" rx="8" fill="#f4f6f7"/>
  <path d="M20 212 a8 8 0 0 1 8-8 h204 v104 h-204 a8 8 0 0 1 -8-8 z" fill="#c0603f"/>
  <text x="38" y="236" font-size="15" font-weight="700" fill="#ffffff">models/intermediate/</text>
  <rect x="38" y="250" width="56" height="22" rx="11" fill="#ffffff"/>
  <text x="66" y="265" font-size="12.5" font-weight="700" fill="#c0603f" text-anchor="middle">int_</text>
  <text x="38" y="290" font-size="11.5" fill="#ffffff">1 modelo</text>

  <text x="258" y="232" font-size="12.5" fill="#2b3a42">Piezas reutilizables que nadie consulta directamente:</text>
  <text x="258" y="250" font-size="12.5" fill="#2b3a42">el join y la regla de negocio que comparten varios</text>
  <text x="258" y="268" font-size="12.5" fill="#2b3a42">marts, resueltos una sola vez.</text>

  <rect x="596" y="218" width="62" height="24" rx="6" fill="#c0603f"/>
  <text x="627" y="234" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">view</text>
  <text x="596" y="262" font-size="11.5" fill="#5a6b73">lee con</text>
  <text x="596" y="280" font-size="13" font-weight="700" fill="#2f6fed">ref()</text>

  <text x="736" y="240" font-size="12" fill="#2b3a42">int_ventas_</text>
  <text x="736" y="258" font-size="12" fill="#2b3a42">enriquecidas</text>

  <!-- ===================== MARTS ===================== -->
  <rect x="20" y="318" width="820" height="104" rx="8" fill="#f4f6f7"/>
  <path d="M20 326 a8 8 0 0 1 8-8 h204 v104 h-204 a8 8 0 0 1 -8-8 z" fill="#7d5ba6"/>
  <text x="38" y="350" font-size="15" font-weight="700" fill="#ffffff">models/marts/</text>
  <rect x="38" y="364" width="52" height="22" rx="11" fill="#ffffff"/>
  <text x="64" y="379" font-size="12.5" font-weight="700" fill="#7d5ba6" text-anchor="middle">dim_</text>
  <rect x="96" y="364" width="56" height="22" rx="11" fill="#ffffff"/>
  <text x="124" y="379" font-size="12.5" font-weight="700" fill="#7d5ba6" text-anchor="middle">fact_</text>
  <text x="38" y="404" font-size="11.5" fill="#ffffff">7 modelos</text>

  <text x="258" y="346" font-size="12.5" fill="#2b3a42">Lo que el negocio consulta: dimensiones, hechos e</text>
  <text x="258" y="364" font-size="12.5" fill="#2b3a42">informes listos para BI. Aquí sí se combinan</text>
  <text x="258" y="382" font-size="12.5" fill="#2b3a42">fuentes y se agregan métricas.</text>

  <rect x="596" y="332" width="62" height="24" rx="6" fill="#7d5ba6"/>
  <text x="627" y="348" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">table</text>
  <text x="596" y="376" font-size="11.5" fill="#5a6b73">lee con</text>
  <text x="596" y="394" font-size="13" font-weight="700" fill="#2f6fed">ref()</text>

  <text x="736" y="348" font-size="12" fill="#2b3a42">dim_producto</text>
  <text x="736" y="368" font-size="12" fill="#2b3a42">fact_ventas</text>
  <text x="736" y="388" font-size="12" fill="#2b3a42">ingresos_por_dep…</text>

  <!-- ===================== REGLA DE DECISIÓN ===================== -->
  <rect x="20" y="436" width="820" height="62" rx="8" fill="#ffffff" stroke="#c0603f" stroke-width="1.5"/>
  <rect x="20" y="436" width="5" height="62" rx="2.5" fill="#c0603f"/>
  <text x="40" y="458" font-size="12.5" font-weight="700" fill="#c0603f">¿Cuándo hace falta la capa intermedia?</text>
  <text x="40" y="477" font-size="12" fill="#2b3a42">Cuando dos o más modelos aguas abajo reutilizan la misma transformación. int_ventas_enriquecidas existe porque lo usan</text>
  <text x="40" y="492" font-size="12" fill="#2b3a42">dos marts; las devoluciones no tienen capa intermedia, porque sólo las consume uno.</text>
</svg>
