<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 570" width="880" height="570" font-family="Helvetica, Arial, sans-serif">
<!--
  Paleta (IABD):
    #37474F  control / coordinador
    #2F6F6A  motores de cómputo        (sec. #C5E2DE, borde #24564F)
    #8A6D2A  catálogo / metastore      (sec. #EEE1C2, borde #6B5320)
    #A9634E  object storage            (sec. #F2DED6, borde #874C3A)
    #2C6FB5  flechas de acceso a datos
    #78909C  gris (implícito, punteado)
-->
  <defs>
    <marker id="mc-dark" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="mc-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#2C6FB5"/>
    </marker>
    <marker id="mc-grey" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#78909C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="570" fill="#FFFFFF"/>

  <!-- bandas -->
  <rect x="14" y="42" width="852" height="110" rx="6" fill="#FAFAFA" stroke="#ECEFF1"/>
  <rect x="14" y="214" width="852" height="96" rx="6" fill="#FAFAFA" stroke="#ECEFF1"/>
  <rect x="14" y="378" width="852" height="112" rx="6" fill="#FAFAFA" stroke="#ECEFF1"/>

  <text x="26" y="92" font-size="12" font-weight="bold" fill="#90A4AE" letter-spacing="1">MOTOR</text>
  <text x="26" y="108" font-size="10" fill="#B0BEC5">planifica y</text>
  <text x="26" y="120" font-size="10" fill="#B0BEC5">ejecuta el SQL</text>

  <text x="26" y="256" font-size="12" font-weight="bold" fill="#90A4AE" letter-spacing="1">CATÁLOGO</text>
  <text x="26" y="272" font-size="10" fill="#B0BEC5">qué tablas hay,</text>
  <text x="26" y="284" font-size="10" fill="#B0BEC5">dónde y con</text>
  <text x="26" y="296" font-size="10" fill="#B0BEC5">qué esquema</text>

  <text x="26" y="424" font-size="11" font-weight="bold" fill="#90A4AE">ALMACENAMIENTO</text>
  <text x="26" y="440" font-size="10" fill="#B0BEC5">los bytes</text>

  <!-- ================= MOTORES ================= -->
  <!-- DuckDB -->
  <rect x="150" y="56" width="200" height="82" rx="6" fill="#2F6F6A" stroke="#24564F" stroke-width="1.5"/>
  <text x="250" y="86" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DuckDB</text>
  <text x="250" y="106" font-size="11" fill="#C5E2DE" text-anchor="middle">in-process · 1 nodo</text>
  <text x="250" y="123" font-size="11" fill="#C5E2DE" text-anchor="middle">tu portátil, tu proceso</text>

  <!-- Trino -->
  <rect x="380" y="56" width="200" height="82" rx="6" fill="#2F6F6A" stroke="#24564F" stroke-width="1.5"/>
  <text x="480" y="86" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Trino</text>
  <text x="480" y="106" font-size="11" fill="#C5E2DE" text-anchor="middle">MPP distribuido</text>
  <text x="480" y="123" font-size="11" fill="#C5E2DE" text-anchor="middle">coordinador + workers</text>

  <!-- Athena -->
  <rect x="610" y="56" width="200" height="82" rx="6" fill="#2F6F6A" stroke="#24564F" stroke-width="1.5"/>
  <text x="710" y="86" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AWS Athena</text>
  <text x="710" y="106" font-size="11" fill="#C5E2DE" text-anchor="middle">serverless</text>
  <text x="710" y="123" font-size="11" fill="#C5E2DE" text-anchor="middle">Trino gestionado</text>

  <!-- ================= CATÁLOGOS ================= -->
  <!-- árbol de directorios -->
  <rect x="175" y="228" width="150" height="68" rx="6" fill="#FFFFFF" stroke="#78909C" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="250" y="252" font-size="12" font-weight="bold" fill="#546E7A" text-anchor="middle">sin catálogo</text>
  <text x="250" y="270" font-size="10" fill="#78909C" text-anchor="middle">el árbol de directorios</text>
  <text x="250" y="284" font-size="10" fill="#78909C" text-anchor="middle">y el footer del Parquet</text>

  <!-- Hive Metastore -->
  <rect x="405" y="228" width="150" height="68" rx="6" fill="#8A6D2A" stroke="#6B5320" stroke-width="1.5"/>
  <text x="480" y="252" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Hive Metastore</text>
  <text x="480" y="270" font-size="10" fill="#EEE1C2" text-anchor="middle">iabd-hive-metastore:9083</text>
  <text x="480" y="284" font-size="10" fill="#EEE1C2" text-anchor="middle">metadatos en iabd-mysql</text>

  <!-- Glue -->
  <rect x="635" y="228" width="150" height="68" rx="6" fill="#8A6D2A" stroke="#6B5320" stroke-width="1.5"/>
  <text x="710" y="252" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Glue Data Catalog</text>
  <text x="710" y="270" font-size="10" fill="#EEE1C2" text-anchor="middle">compatible con la API</text>
  <text x="710" y="284" font-size="10" fill="#EEE1C2" text-anchor="middle">de Hive Metastore</text>

  <!-- ================= ALMACENAMIENTO ================= -->
  <rect x="150" y="392" width="430" height="86" rx="6" fill="#A9634E" stroke="#874C3A" stroke-width="1.5"/>
  <text x="365" y="416" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MinIO — iabd-minio:9000</text>
  <rect x="170" y="428" width="128" height="34" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#F2DED6"/>
  <text x="234" y="443" font-size="9" fill="#FFFFFF" text-anchor="middle">order_status=COMPLETE/</text>
  <text x="234" y="455" font-size="9" fill="#F2DED6" text-anchor="middle">data_0.parquet</text>
  <rect x="308" y="428" width="128" height="34" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#F2DED6"/>
  <text x="372" y="443" font-size="9" fill="#FFFFFF" text-anchor="middle">order_status=PENDING/</text>
  <text x="372" y="455" font-size="9" fill="#F2DED6" text-anchor="middle">data_0.parquet</text>
  <rect x="446" y="428" width="114" height="34" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#F2DED6"/>
  <text x="503" y="449" font-size="14" fill="#F2DED6" text-anchor="middle">…</text>

  <rect x="610" y="392" width="200" height="86" rx="6" fill="#A9634E" stroke="#874C3A" stroke-width="1.5"/>
  <text x="710" y="416" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Amazon S3</text>
  <rect x="628" y="428" width="164" height="34" rx="3" fill="#FFFFFF" fill-opacity="0.15" stroke="#F2DED6"/>
  <text x="710" y="443" font-size="9" fill="#FFFFFF" text-anchor="middle">s3://s3severo8a-cli/retail/</text>
  <text x="710" y="455" font-size="9" fill="#F2DED6" text-anchor="middle">orders/order_status=…/</text>

  <!-- ================= FLECHAS ================= -->
  <!-- metadatos (oscuras / gris para DuckDB) -->
  <path d="M250,138 L250,224" stroke="#78909C" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#mc-grey)"/>
  <path d="M480,138 L480,224" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#mc-dark)"/>
  <path d="M710,138 L710,224" stroke="#37474F" stroke-width="1.8" fill="none" marker-end="url(#mc-dark)"/>

  <!-- datos (azules) -->
  <path d="M340,138 L340,388" stroke="#2C6FB5" stroke-width="2.2" fill="none" marker-end="url(#mc-blue)"/>
  <path d="M570,138 L570,388" stroke="#2C6FB5" stroke-width="2.2" fill="none" marker-end="url(#mc-blue)"/>
  <path d="M800,138 L800,388" stroke="#2C6FB5" stroke-width="2.2" fill="none" marker-end="url(#mc-blue)"/>

  <text x="348" y="356" font-size="10" fill="#2C6FB5">bytes</text>
  <text x="578" y="356" font-size="10" fill="#2C6FB5">bytes</text>
  <text x="808" y="356" font-size="10" fill="#2C6FB5">bytes</text>

  <text x="258" y="188" font-size="10" fill="#78909C">lista el bucket</text>
  <text x="258" y="200" font-size="10" fill="#78909C">en cada consulta</text>
  <text x="488" y="188" font-size="10" fill="#37474F">metadatos</text>
  <text x="718" y="188" font-size="10" fill="#37474F">metadatos</text>

  <!-- ================= LEYENDA ================= -->
  <line x1="150" y1="512" x2="182" y2="512" stroke="#37474F" stroke-width="1.8" marker-end="url(#mc-dark)"/>
  <text x="192" y="516" font-size="10" fill="#546E7A">metadatos (esquema, particiones)</text>

  <line x1="400" y1="512" x2="432" y2="512" stroke="#2C6FB5" stroke-width="2.2" marker-end="url(#mc-blue)"/>
  <text x="442" y="516" font-size="10" fill="#546E7A">acceso a datos</text>

  <line x1="570" y1="512" x2="602" y2="512" stroke="#78909C" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#mc-grey)"/>
  <text x="612" y="516" font-size="10" fill="#546E7A">catálogo implícito (sin metastore)</text>

  <text x="150" y="544" font-size="11" fill="#90A4AE">Las tres capas están desacopladas: cambiar de motor no toca ni el catálogo ni el dato.</text>
</svg>
