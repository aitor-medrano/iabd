<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">El marco (frame) de una ventana</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#64748b">para la fila en curso (abril), qué filas entran en el cálculo</text>

  <!-- ================= Panel A: acumulado ================= -->
  <text x="160" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Total acumulado</text>
  <text x="160" y="103" text-anchor="middle" font-size="9.5" fill="#92400e" font-family="ui-monospace, monospace">UNBOUNDED PRECEDING → CURRENT ROW</text>

  <!-- filas (mes | ingresos); sombreadas Ene..Abr -->
  <g font-size="12">
    <rect x="70" y="116" width="70" height="32" fill="#fef3c7" stroke="#fcd34d"/><rect x="140" y="116" width="110" height="32" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="105" y="136" text-anchor="middle" fill="#92400e">Ene</text><text x="195" y="136" text-anchor="middle" fill="#92400e">100</text>
    <rect x="70" y="148" width="70" height="32" fill="#fef3c7" stroke="#fcd34d"/><rect x="140" y="148" width="110" height="32" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="105" y="168" text-anchor="middle" fill="#92400e">Feb</text><text x="195" y="168" text-anchor="middle" fill="#92400e">120</text>
    <rect x="70" y="180" width="70" height="32" fill="#fef3c7" stroke="#fcd34d"/><rect x="140" y="180" width="110" height="32" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="105" y="200" text-anchor="middle" fill="#92400e">Mar</text><text x="195" y="200" text-anchor="middle" fill="#92400e">90</text>
    <!-- fila actual -->
    <rect x="70" y="212" width="180" height="32" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="105" y="232" text-anchor="middle" font-weight="700" fill="#78350f">Abr</text><text x="195" y="232" text-anchor="middle" font-weight="700" fill="#78350f">150</text>
    <!-- fuera del marco -->
    <rect x="70" y="244" width="70" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="140" y="244" width="110" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="105" y="264" text-anchor="middle" fill="#cbd5e1">May</text><text x="195" y="264" text-anchor="middle" fill="#cbd5e1">130</text>
    <rect x="70" y="276" width="70" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="140" y="276" width="110" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="105" y="296" text-anchor="middle" fill="#cbd5e1">Jun</text><text x="195" y="296" text-anchor="middle" fill="#cbd5e1">170</text>
  </g>
  <text x="160" y="336" text-anchor="middle" font-size="13" fill="#0f172a">→ acumulado = <tspan font-weight="700" fill="#92400e">460</tspan></text>
  <text x="160" y="354" text-anchor="middle" font-size="10" fill="#94a3b8">100 + 120 + 90 + 150</text>

  <!-- separador -->
  <line x1="360" y1="80" x2="360" y2="360" stroke="#e2e8f0"/>

  <!-- ================= Panel B: media móvil ================= -->
  <text x="540" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Media móvil (3 meses)</text>
  <text x="540" y="103" text-anchor="middle" font-size="9.5" fill="#92400e" font-family="ui-monospace, monospace">2 PRECEDING → CURRENT ROW</text>

  <g font-size="12">
    <!-- fuera del marco -->
    <rect x="450" y="116" width="70" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="520" y="116" width="110" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="485" y="136" text-anchor="middle" fill="#cbd5e1">Ene</text><text x="575" y="136" text-anchor="middle" fill="#cbd5e1">100</text>
    <!-- marco -->
    <rect x="450" y="148" width="70" height="32" fill="#fef3c7" stroke="#fcd34d"/><rect x="520" y="148" width="110" height="32" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="485" y="168" text-anchor="middle" fill="#92400e">Feb</text><text x="575" y="168" text-anchor="middle" fill="#92400e">120</text>
    <rect x="450" y="180" width="70" height="32" fill="#fef3c7" stroke="#fcd34d"/><rect x="520" y="180" width="110" height="32" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="485" y="200" text-anchor="middle" fill="#92400e">Mar</text><text x="575" y="200" text-anchor="middle" fill="#92400e">90</text>
    <!-- fila actual -->
    <rect x="450" y="212" width="180" height="32" fill="#fde68a" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="485" y="232" text-anchor="middle" font-weight="700" fill="#78350f">Abr</text><text x="575" y="232" text-anchor="middle" font-weight="700" fill="#78350f">150</text>
    <!-- fuera del marco -->
    <rect x="450" y="244" width="70" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="520" y="244" width="110" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="485" y="264" text-anchor="middle" fill="#cbd5e1">May</text><text x="575" y="264" text-anchor="middle" fill="#cbd5e1">130</text>
    <rect x="450" y="276" width="70" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="520" y="276" width="110" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="485" y="296" text-anchor="middle" fill="#cbd5e1">Jun</text><text x="575" y="296" text-anchor="middle" fill="#cbd5e1">170</text>
  </g>
  <text x="540" y="336" text-anchor="middle" font-size="13" fill="#0f172a">→ media = <tspan font-weight="700" fill="#92400e">120</tspan></text>
  <text x="540" y="354" text-anchor="middle" font-size="10" fill="#94a3b8">(120 + 90 + 150) / 3</text>
</svg>
