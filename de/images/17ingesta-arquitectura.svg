<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>

  <!-- Fuente: API pública -->
  <rect x="24" y="108" width="176" height="92" rx="8" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="112" y="138" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2b3a">API pública</text>
  <text x="112" y="160" text-anchor="middle" font-size="12" fill="#5f6368">dadesobertes.gva.es</text>
  <text x="112" y="178" text-anchor="middle" font-size="11" fill="#5f6368">CKAN · /datastore_search</text>

  <!-- dlt: driver/control -->
  <rect x="300" y="86" width="240" height="128" rx="8" fill="#2b2b3a"/>
  <text x="420" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">dlt · pipeline (Python)</text>
  <rect x="311" y="128" width="66" height="46" rx="5" fill="#eef1f5"/>
  <text x="344" y="156" text-anchor="middle" font-size="11" fill="#2b2b3a">extract</text>
  <rect x="387" y="128" width="66" height="46" rx="5" fill="#eef1f5"/>
  <text x="420" y="150" text-anchor="middle" font-size="11" fill="#2b2b3a">normalize</text>
  <text x="420" y="164" text-anchor="middle" font-size="11" fill="#2b2b3a">(esquema)</text>
  <rect x="463" y="128" width="66" height="46" rx="5" fill="#eef1f5"/>
  <text x="496" y="156" text-anchor="middle" font-size="11" fill="#2b2b3a">load</text>
  <text x="420" y="200" text-anchor="middle" font-size="11" fill="#c9ccd1">driver: jupyter</text>

  <!-- Destino: DuckDB (motor de cómputo) -->
  <rect x="654" y="58" width="182" height="70" rx="8" fill="#6a4c93"/>
  <text x="745" y="88" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">DuckDB</text>
  <text x="745" y="108" text-anchor="middle" font-size="11" fill="#e6ddf2">análisis analítico local</text>

  <!-- Destino: MinIO (object storage) -->
  <rect x="654" y="178" width="182" height="84" rx="8" fill="#c0562b"/>
  <text x="745" y="205" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">MinIO · iabd-minio:9000</text>
  <text x="745" y="226" text-anchor="middle" font-size="11" fill="#f6ded3">bucket raw-data</text>
  <text x="745" y="244" text-anchor="middle" font-size="11" fill="#f6ded3">(Parquet crudo)</text>

  <!-- Flechas de acceso a datos (azul) -->
  <line x1="200" y1="154" x2="292" y2="150" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="246" y="140" text-anchor="middle" font-size="11" fill="#2b6cb0">extracción</text>

  <line x1="540" y1="128" x2="646" y2="96" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="540" y1="172" x2="646" y2="206" stroke="#2b6cb0" stroke-width="2.5" marker-end="url(#flecha)"/>
  <text x="600" y="185" text-anchor="middle" font-size="11" fill="#2b6cb0">carga (EL)</text>
</svg>
