<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!--
    Los componentes de Hive y su evolución
    La única capa que atraviesa las tres épocas es el catálogo.
    Paleta bloque de ingeniería de datos:
      #2d3142  oscuro    clientes / texto principal
      #3fa39b  teal      catálogo (la constante)
      #6a4c93  púrpura   motores
      #b04a34  terracota almacenamiento
      #8a8f98  gris      anotaciones y eje de tiempo
  -->

  <defs>
    <marker id="fl-tiempo" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="530" fill="#ffffff"/>

  <!-- ============ franjas de época ============ -->
  <rect x="150" y="55" width="230" height="380" fill="#fafbfc"/>
  <rect x="610" y="55" width="270" height="380" fill="#fafbfc"/>

  <text x="265" y="42" font-size="13" font-weight="600" fill="#8a8f98" text-anchor="middle">2008</text>
  <text x="495" y="42" font-size="13" font-weight="600" fill="#8a8f98" text-anchor="middle">2013</text>
  <text x="745" y="42" font-size="13" font-weight="600" fill="#8a8f98" text-anchor="middle">hoy</text>

  <!-- ============ etiquetas de capa ============ -->
  <text x="20" y="100" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.2">CLIENTES</text>

  <text x="20" y="188" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.2">MOTOR</text>
  <text x="20" y="204" font-size="11" font-style="italic" fill="#6a4c93">cambia</text>

  <text x="20" y="288" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.2">CATÁLOGO</text>
  <text x="20" y="304" font-size="11.5" font-weight="600" font-style="italic" fill="#3fa39b">no cambia</text>

  <text x="20" y="385" font-size="10" font-weight="600" fill="#8a8f98" letter-spacing="0.8">ALMACENAMIENTO</text>
  <text x="20" y="401" font-size="11" font-style="italic" fill="#b04a34">cambia</text>

  <!-- ============ CLIENTES ============ -->
  <rect x="158" y="70" width="434" height="58" rx="8" fill="#f4f5f7" stroke="#2d3142" stroke-width="1.4"/>
  <text x="375" y="95" font-size="13.5" font-weight="600" fill="#2d3142" text-anchor="middle">beeline · JDBC / ODBC</text>
  <text x="375" y="113" font-size="10.5" fill="#6b7280" text-anchor="middle">envían HiveQL</text>

  <rect x="618" y="70" width="254" height="58" rx="8" fill="#f4f5f7" stroke="#2d3142" stroke-width="1.4"/>
  <text x="745" y="92" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="middle">CLI de Trino · editor de Athena</text>
  <text x="745" y="107" font-size="12.5" font-weight="600" fill="#2d3142" text-anchor="middle">cuadernos · BI</text>
  <text x="745" y="121" font-size="10.5" fill="#6b7280" text-anchor="middle">cada motor, con su propio SQL</text>

  <!-- ============ MOTOR ============ -->
  <rect x="158" y="155" width="214" height="72" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="265" y="185" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">MapReduce</text>
  <text x="265" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">por lotes, disco entre etapas</text>

  <rect x="398" y="155" width="194" height="72" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="495" y="185" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Tez</text>
  <text x="495" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">DAG, sin pasar por HDFS</text>

  <rect x="618" y="155" width="254" height="72" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="745" y="185" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Trino · Spark · Athena</text>
  <text x="745" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">MPP, en memoria</text>

  <!-- ============ CATÁLOGO: la constante ============ -->
  <rect x="158" y="255" width="714" height="80" rx="10" fill="#eaf5f4" stroke="#3fa39b" stroke-width="2.4"/>
  <text x="515" y="288" font-size="19" font-weight="600" fill="#2d3142" text-anchor="middle">Hive Metastore</text>
  <text x="515" y="309" font-size="11.5" fill="#6b7280" text-anchor="middle">qué tablas hay · dónde están · qué columnas · qué particiones</text>
  <text x="515" y="325" font-size="11" fill="#3fa39b" text-anchor="middle">el mismo protocolo Thrift desde 2008 — en AWS, como Glue Data Catalog</text>

  <!-- ============ ALMACENAMIENTO ============ -->
  <rect x="158" y="355" width="434" height="62" rx="8" fill="#fdf7f5" stroke="#b04a34" stroke-width="1.6"/>
  <text x="375" y="382" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">HDFS</text>
  <text x="375" y="400" font-size="10.5" fill="#6b7280" text-anchor="middle">discos del propio clúster</text>

  <rect x="618" y="355" width="254" height="62" rx="8" fill="#fdf7f5" stroke="#b04a34" stroke-width="1.6"/>
  <text x="745" y="382" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">S3 · MinIO</text>
  <text x="745" y="400" font-size="10.5" fill="#6b7280" text-anchor="middle">object storage (y HDFS donde sigue vivo)</text>

  <!-- ============ eje de tiempo ============ -->
  <path d="M158,452 L866,452" stroke="#8a8f98" stroke-width="1.4" fill="none" marker-end="url(#fl-tiempo)"/>
  <text x="128" y="456" font-size="10.5" font-style="italic" fill="#8a8f98" text-anchor="end">tiempo</text>

  <!-- ============ cierre ============ -->
  <text x="450" y="492" font-size="12.5" fill="#2d3142" text-anchor="middle">
    Cambian los clientes, cambia el motor y cambia el almacenamiento. La pieza del medio, no.
  </text>
  <text x="450" y="512" font-size="11" font-style="italic" fill="#8a8f98" text-anchor="middle">
    Por eso Trino y Athena leen las tablas de Hive sin ejecutar una sola línea de HiveQL.
  </text>

</svg>
