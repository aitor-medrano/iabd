<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 568" width="900" height="568" font-family="Helvetica, Arial, sans-serif">
<!--
  Paleta IABD:
    #2b3a42 oscuro   origen / control / metadatos
    #3fa39b teal     catálogo
    #7d5ba6 morado   motores
    #c0603f terracota datos / almacenamiento
    #2f6fed azul     nodo lab y flechas de datos
    #4f8a6d verde    Airflow / orquestación (aquí: commit aceptado)
    #8a8f98 gris     contenedores de un solo uso (init)
-->
<defs><marker id="f2b3a42" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a42"/></marker><marker id="f4f8a6d" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f8a6d"/></marker><marker id="fc0603f" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0603f"/></marker></defs>
<rect x="0" y="0" width="900" height="568" fill="#ffffff"/>
<text x="40" y="38" font-size="20" fill="#2b3a42" font-weight="bold">Commit optimista</text>
<text x="40" y="60" font-size="13" fill="#5c626e">Dos escritores trabajan a la vez sin bloqueos; el catálogo acepta el primer cambio de puntero.</text>
<rect x="80" y="84" width="180" height="46" rx="7" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="1.4"/>
<text x="170.0" y="104.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Escritor A</text>
<text x="170.0" y="120.0" font-size="11" fill="#ffffff" text-anchor="middle">DuckDB</text>
<rect x="360" y="84" width="180" height="46" rx="7" fill="#3fa39b" stroke="#3fa39b" stroke-width="1.4"/>
<text x="450.0" y="104.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Catálogo</text>
<text x="450.0" y="120.0" font-size="11" fill="#ffffff" text-anchor="middle">Polaris · orders → v1</text>
<rect x="640" y="84" width="180" height="46" rx="7" fill="#7d5ba6" stroke="#7d5ba6" stroke-width="1.4"/>
<text x="730.0" y="104.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">Escritor B</text>
<text x="730.0" y="120.0" font-size="11" fill="#ffffff" text-anchor="middle">PyIceberg</text>
<line x1="170" y1="130" x2="170" y2="520" stroke="#d7dae0" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="450" y1="130" x2="450" y2="520" stroke="#d7dae0" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="730" y1="130" x2="730" y2="520" stroke="#d7dae0" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="40" y="165" font-size="14" fill="#2b3a42" text-anchor="start" font-weight="bold">1</text>
<path d="M444,160 L174,160" fill="none" stroke="#2b3a42" stroke-width="1.6" marker-end="url(#f2b3a42)"/>
<path d="M456,160 L726,160" fill="none" stroke="#2b3a42" stroke-width="1.6" marker-end="url(#f2b3a42)"/>
<text x="310" y="154" font-size="11" fill="#5c626e" text-anchor="middle">lee v1</text>
<text x="590" y="154" font-size="11" fill="#5c626e" text-anchor="middle">lee v1</text>
<text x="40" y="222" font-size="14" fill="#2b3a42" text-anchor="start" font-weight="bold">2</text>
<rect x="100" y="200" width="140" height="40" rx="7" fill="#ffffff" stroke="#c0603f" stroke-width="1.4"/>
<text x="170.0" y="217.0" font-size="13" fill="#c0603f" text-anchor="middle" font-weight="bold">datos + v2</text>
<text x="170.0" y="233.0" font-size="11" fill="#5c626e" text-anchor="middle">aún invisibles</text>
<rect x="660" y="200" width="140" height="40" rx="7" fill="#ffffff" stroke="#c0603f" stroke-width="1.4"/>
<text x="730.0" y="217.0" font-size="13" fill="#c0603f" text-anchor="middle" font-weight="bold">datos + v2′</text>
<text x="730.0" y="233.0" font-size="11" fill="#5c626e" text-anchor="middle">aún invisibles</text>
<text x="40" y="290" font-size="14" fill="#2b3a42" text-anchor="start" font-weight="bold">3</text>
<path d="M174,282 L446,282" fill="none" stroke="#4f8a6d" stroke-width="2" marker-end="url(#f4f8a6d)"/>
<text x="310" y="274" font-size="11" fill="#2b3a42" text-anchor="middle">¿sigue en v1? → v2</text>
<text x="310" y="302" font-size="12" fill="#4f8a6d" text-anchor="middle" font-weight="bold">aceptado: orders → v2</text>
<text x="40" y="356" font-size="14" fill="#2b3a42" text-anchor="start" font-weight="bold">4</text>
<path d="M726,348 L454,348" fill="none" stroke="#c0603f" stroke-width="2" marker-end="url(#fc0603f)"/>
<text x="590" y="340" font-size="11" fill="#2b3a42" text-anchor="middle">¿sigue en v1? → v2′</text>
<text x="590" y="368" font-size="12" fill="#c0603f" text-anchor="middle" font-weight="bold">rechazado: ya apunta a v2</text>
<text x="40" y="422" font-size="14" fill="#2b3a42" text-anchor="start" font-weight="bold">5</text>
<path d="M456,414 L726,414" fill="none" stroke="#2b3a42" stroke-width="1.6" marker-end="url(#f2b3a42)"/>
<text x="590" y="408" font-size="11" fill="#5c626e" text-anchor="middle">relee v2 y rehace sus metadatos</text>
<text x="40" y="482" font-size="14" fill="#2b3a42" text-anchor="start" font-weight="bold">6</text>
<path d="M726,474 L454,474" fill="none" stroke="#4f8a6d" stroke-width="2" marker-end="url(#f4f8a6d)"/>
<text x="590" y="466" font-size="11" fill="#2b3a42" text-anchor="middle">¿sigue en v2? → v3</text>
<text x="590" y="494" font-size="12" fill="#4f8a6d" text-anchor="middle" font-weight="bold">aceptado: orders → v3</text>
<text x="450" y="548" font-size="12" fill="#5c626e" text-anchor="middle">Quien lee ve v1, v2 o v3, nunca una mezcla. Si los cambios se solapan, el reintento falla.</text>
</svg>
