<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 530" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="530" fill="#ffffff"/>

  <defs>
    <marker id="flecha" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>

  <!-- Consulta -->
  <rect x="20" y="30" width="250" height="100" rx="8" fill="#37474f"/>
  <text x="145" y="56" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Consulta</text>
  <text x="145" y="82"  text-anchor="middle" fill="#eceff1" font-size="11" font-family="monospace">SELECT SUM(Revenue)</text>
  <text x="145" y="100" text-anchor="middle" fill="#eceff1" font-size="11" font-family="monospace">FROM pdi_sales</text>
  <text x="145" y="118" text-anchor="middle" fill="#ffca28" font-size="11" font-family="monospace">WHERE Country = 'Germany'</text>

  <!-- Paso 1 -->
  <path d="M145,130 L145,388 L302,388" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="138" y="250" text-anchor="end" fill="#37474f" font-size="12" font-weight="bold">1. Lee los metadatos</text>
  <text x="138" y="266" text-anchor="end" fill="#37474f" font-size="12">del pie del fichero</text>

  <!-- Fichero -->
  <rect x="285" y="20" width="430" height="490" rx="10" fill="none" stroke="#90a4ae" stroke-width="2"/>
  <text x="300" y="44" fill="#546e7a" font-size="14" font-weight="bold">pdi_sales.parquet</text>
  <text x="700" y="44" text-anchor="end" fill="#90a4ae" font-size="12">841.147 filas</text>

  <!-- Row group 0: descartado -->
  <rect x="305" y="58" width="390" height="60" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="320" y="78" fill="#757575" font-size="12" font-weight="bold">Row group 0</text>
  <text x="410" y="78" fill="#9e9e9e" font-size="11">210.287 filas</text>
  <text x="320" y="96" fill="#9e9e9e" font-size="11" font-family="monospace">Country: Canada ... France</text>
  <text x="320" y="112" fill="#9e9e9e" font-size="10">'Germany' &gt; 'France' → no se lee del disco</text>
  <text x="668" y="94" text-anchor="middle" fill="#9e9e9e" font-size="24">✗</text>

  <!-- Row group 1: se lee -->
  <rect x="305" y="124" width="390" height="60" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="320" y="144" fill="#1565c0" font-size="12" font-weight="bold">Row group 1</text>
  <text x="410" y="144" fill="#1e88e5" font-size="11">210.287 filas</text>
  <text x="320" y="162" fill="#1e88e5" font-size="11" font-family="monospace">Country: France ... Germany</text>
  <text x="320" y="178" fill="#1e88e5" font-size="10">puede contener 'Germany' → se lee y se filtra</text>
  <text x="668" y="160" text-anchor="middle" fill="#1e88e5" font-size="22">✓</text>

  <!-- Row group 2: se lee -->
  <rect x="305" y="190" width="390" height="60" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="320" y="210" fill="#1565c0" font-size="12" font-weight="bold">Row group 2</text>
  <text x="410" y="210" fill="#1e88e5" font-size="11">210.287 filas</text>
  <text x="320" y="228" fill="#1e88e5" font-size="11" font-family="monospace">Country: Germany ... Mexico</text>
  <text x="320" y="244" fill="#1e88e5" font-size="10">puede contener 'Germany' → se lee y se filtra</text>
  <text x="668" y="226" text-anchor="middle" fill="#1e88e5" font-size="22">✓</text>

  <!-- Row group 3: descartado -->
  <rect x="305" y="256" width="390" height="60" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="320" y="276" fill="#757575" font-size="12" font-weight="bold">Row group 3</text>
  <text x="410" y="276" fill="#9e9e9e" font-size="11">210.286 filas</text>
  <text x="320" y="294" fill="#9e9e9e" font-size="11" font-family="monospace">Country: Mexico ... Mexico</text>
  <text x="320" y="310" fill="#9e9e9e" font-size="10">'Germany' &lt; 'Mexico' → no se lee del disco</text>
  <text x="668" y="292" text-anchor="middle" fill="#9e9e9e" font-size="24">✗</text>

  <!-- Metadatos -->
  <rect x="305" y="332" width="395" height="112" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="320" y="354" fill="#37474f" font-size="13" font-weight="bold">Footer</text>
  <text x="378" y="354" fill="#78909c" font-size="12">estadísticas de Country por row group</text>
  <text x="320" y="376" fill="#546e7a" font-size="11" font-family="monospace">RG0 · min=Canada  · max=France</text>
  <text x="320" y="394" fill="#546e7a" font-size="11" font-family="monospace">RG1 · min=France  · max=Germany</text>
  <text x="320" y="412" fill="#546e7a" font-size="11" font-family="monospace">RG2 · min=Germany · max=Mexico</text>
  <text x="320" y="430" fill="#546e7a" font-size="11" font-family="monospace">RG3 · min=Mexico  · max=Mexico</text>

  <!-- Paso 2 -->
  <path d="M700,346 C782,292 782,218 698,152" fill="none" stroke="#37474f" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="730" y="372" fill="#37474f" font-size="12" font-weight="bold">2. Compara el</text>
  <text x="730" y="388" fill="#37474f" font-size="12">filtro con los</text>
  <text x="730" y="404" fill="#37474f" font-size="12">min/max</text>

  <!-- Resultado -->
  <rect x="305" y="458" width="395" height="34" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="320" y="480" fill="#1565c0" font-size="12" font-weight="bold">3. Se leen 2 de 4 row groups:</text>
  <text x="516" y="480" fill="#1e88e5" font-size="12">420.574 de 841.147 filas</text>
</svg>
