<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <!-- fondo -->
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- título -->
  <text x="334" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Ciclo de vida de la Ingeniería de datos</text>

  <!-- Generación -->
  <rect x="16" y="96" width="112" height="62" rx="8" fill="#dd8a82" stroke="#b5564d"/>
  <text x="72" y="132" text-anchor="middle" font-size="14" fill="#2a0f0c">Generación</text>

  <!-- Contenedor -->
  <rect x="156" y="60" width="356" height="150" rx="14" fill="none" stroke="#111111" stroke-width="5"/>

  <!-- Fila superior -->
  <rect x="168" y="74" width="104" height="58" rx="4" fill="#2f9e78" stroke="#227a5c"/>
  <text x="220" y="108" text-anchor="middle" font-size="14" fill="#ffffff">Ingesta</text>

  <rect x="280" y="74" width="116" height="58" rx="4" fill="#c23a90" stroke="#9c2c73"/>
  <text x="338" y="108" text-anchor="middle" font-size="12.5" fill="#ffffff">Transformación</text>

  <rect x="404" y="74" width="96" height="58" rx="4" fill="#2f7dc4" stroke="#245f97"/>
  <text x="452" y="108" text-anchor="middle" font-size="14" fill="#ffffff">Serving</text>

  <!-- flechas blancas internas -->
  <path d="M268,99 h8 v-4 l8,8 l-8,8 v-4 h-8 z" fill="#ffffff"/>
  <path d="M392,99 h8 v-4 l8,8 l-8,8 v-4 h-8 z" fill="#ffffff"/>

  <!-- Almacenamiento -->
  <rect x="168" y="140" width="332" height="56" rx="4" fill="#e2e2e2" stroke="#a8a8a8"/>
  <text x="334" y="173" text-anchor="middle" font-size="14" fill="#1f2937">Almacenamiento</text>

  <!-- Salidas -->
  <rect x="560" y="62" width="146" height="46" rx="8" fill="#f6e14b" stroke="#d4bf1e"/>
  <text x="633" y="90" text-anchor="middle" font-size="14" fill="#1f2937">Analítica</text>

  <rect x="560" y="118" width="146" height="46" rx="8" fill="#f6e14b" stroke="#d4bf1e"/>
  <text x="633" y="136" text-anchor="middle" font-size="13.5" fill="#1f2937">Machine</text>
  <text x="633" y="153" text-anchor="middle" font-size="13.5" fill="#1f2937">learning</text>

  <rect x="560" y="174" width="146" height="46" rx="8" fill="#f6e14b" stroke="#d4bf1e"/>
  <text x="633" y="202" text-anchor="middle" font-size="14" fill="#1f2937">Reverse ETL</text>

  <!-- conectores -->
  <line x1="128" y1="127" x2="153" y2="127" stroke="#111111" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="513" y1="103" x2="557" y2="85" stroke="#111111" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="515" y1="135" x2="557" y2="141" stroke="#111111" stroke-width="2.5" marker-end="url(#arw)"/>
  <line x1="513" y1="167" x2="557" y2="197" stroke="#111111" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- separador -->
  <line x1="18" y1="244" x2="702" y2="244" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Corrientes subyacentes -->
  <text x="360" y="270" text-anchor="middle" font-size="15" fill="#334155">Áreas transversales</text>

  <rect x="18" y="284" width="104" height="50" rx="8" fill="#b98ed6" stroke="#9a6cc0"/>
  <text x="70" y="313" text-anchor="middle" font-size="13" fill="#1f2937">Seguridad</text>

  <rect x="134" y="284" width="104" height="50" rx="8" fill="#aecbe4" stroke="#86a9cc"/>
  <text x="186" y="304" text-anchor="middle" font-size="12.5" fill="#1f2937">Gestión de</text>
  <text x="186" y="320" text-anchor="middle" font-size="12.5" fill="#1f2937">datos</text>

  <rect x="250" y="284" width="104" height="50" rx="8" fill="#efe7a8" stroke="#d4c86f"/>
  <text x="302" y="313" text-anchor="middle" font-size="13" fill="#1f2937">DataOps</text>

  <rect x="366" y="284" width="104" height="50" rx="8" fill="#86bd9f" stroke="#5d9a7c"/>
  <text x="418" y="304" text-anchor="middle" font-size="12.5" fill="#1f2937">Arquitectura</text>
  <text x="418" y="320" text-anchor="middle" font-size="12.5" fill="#1f2937">de datos</text>

  <rect x="482" y="284" width="104" height="50" rx="8" fill="#e3a6a1" stroke="#c47b74"/>
  <text x="534" y="313" text-anchor="middle" font-size="13" fill="#1f2937">Orquestación</text>

  <rect x="598" y="284" width="104" height="50" rx="8" fill="#efe7a8" stroke="#d4c86f"/>
  <text x="650" y="304" text-anchor="middle" font-size="12.5" fill="#1f2937">Ingeniería del</text>
  <text x="650" y="320" text-anchor="middle" font-size="12.5" fill="#1f2937">software</text>
</svg>
