<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="600" fill="#ffffff"/>

  <!-- ================= NIVEL 1: FICHERO ================= -->
  <rect x="20" y="20" width="740" height="565" rx="8" fill="none" stroke="#90a4ae" stroke-width="2"/>
  <text x="36" y="45" fill="#37474f" font-size="14" font-weight="bold">1. Fichero</text>
  <text x="120" y="45" fill="#546e7a" font-size="13" font-family="monospace">ventas.parquet</text>

  <!-- Magic number superior -->
  <rect x="40" y="58" width="700" height="24" fill="#37474f"/>
  <text x="52" y="75" fill="#eceff1" font-size="11" font-family="monospace">PAR1</text>
  <text x="728" y="75" text-anchor="end" fill="#90a4ae" font-size="11">4 bytes</text>

  <!-- ================= NIVEL 2: ROW GROUP ================= -->
  <rect x="40" y="96" width="700" height="242" rx="6" fill="#fafafa" stroke="#546e7a" stroke-width="2"/>
  <text x="56" y="118" fill="#37474f" font-size="13" font-weight="bold">2. Row group 0</text>
  <text x="168" y="118" fill="#78909c" font-size="12">~1.000.000 filas · unidad de paralelismo</text>

  <!-- NIVEL 3: COLUMN CHUNK (Country) -->
  <rect x="58" y="130" width="664" height="94" rx="5" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
  <text x="72" y="149" fill="#e65100" font-size="12" font-weight="bold">3. Column chunk</text>
  <text x="180" y="149" fill="#ef6c00" font-size="12" font-family="monospace">Country</text>

  <!-- NIVEL 4: paginas de Country -->
  <rect x="72" y="158" width="200" height="54" rx="4" fill="#ffffff" stroke="#ef6c00" stroke-width="1"/>
  <text x="82" y="176" fill="#e65100" font-size="11" font-weight="bold">4. Dictionary page</text>
  <text x="82" y="196" fill="#ef6c00" font-size="10" font-family="monospace">0:France</text>
  <text x="82" y="207" fill="#ef6c00" font-size="10" font-family="monospace">1:Germany</text>

  <rect x="290" y="158" width="200" height="54" rx="4" fill="#ffffff" stroke="#ef6c00" stroke-width="1"/>
  <text x="300" y="176" fill="#e65100" font-size="11" font-weight="bold">4. Página 0</text>
  <text x="300" y="196" fill="#ef6c00" font-size="10" font-family="monospace">0,0,0,0,0,0,0,0...</text>
  <text x="300" y="207" fill="#bf7000" font-size="10">índices, no textos</text>

  <rect x="508" y="158" width="200" height="54" rx="4" fill="#ffffff" stroke="#ef6c00" stroke-width="1"/>
  <text x="518" y="176" fill="#e65100" font-size="11" font-weight="bold">4. Página 1</text>
  <text x="518" y="196" fill="#ef6c00" font-size="10" font-family="monospace">0,0,0,1,1,1,1,1...</text>

  <!-- NIVEL 3: COLUMN CHUNK (Revenue) -->
  <rect x="58" y="232" width="664" height="94" rx="5" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="72" y="251" fill="#1565c0" font-size="12" font-weight="bold">3. Column chunk</text>
  <text x="180" y="251" fill="#1e88e5" font-size="12" font-family="monospace">Revenue</text>

  <rect x="72" y="260" width="200" height="54" rx="4" fill="#ffffff" stroke="#1e88e5" stroke-width="1"/>
  <text x="82" y="278" fill="#1565c0" font-size="11" font-weight="bold">4. Página 0</text>
  <text x="82" y="298" fill="#1e88e5" font-size="10" font-family="monospace">48.2, 17.9, 63.1...</text>

  <rect x="290" y="260" width="200" height="54" rx="4" fill="#ffffff" stroke="#1e88e5" stroke-width="1"/>
  <text x="300" y="278" fill="#1565c0" font-size="11" font-weight="bold">4. Página 1</text>
  <text x="300" y="298" fill="#1e88e5" font-size="10" font-family="monospace">9.05, 71.4, 30.8...</text>

  <rect x="508" y="260" width="200" height="54" rx="4" fill="#ffffff" stroke="#1e88e5" stroke-width="1"/>
  <text x="518" y="278" fill="#1565c0" font-size="11" font-weight="bold">4. Página 2</text>
  <text x="518" y="298" fill="#1e88e5" font-size="10" font-family="monospace">55.6, 2.31, 88.0...</text>

  <!-- ================= ROW GROUP 1 (resumido) ================= -->
  <rect x="40" y="350" width="700" height="42" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="56" y="376" fill="#757575" font-size="13" font-weight="bold">Row group 1</text>
  <text x="168" y="376" fill="#9e9e9e" font-size="12">mismas columnas, siguiente millón de filas...</text>

  <!-- ================= FOOTER ================= -->
  <rect x="40" y="406" width="700" height="132" rx="6" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="56" y="428" fill="#37474f" font-size="13" font-weight="bold">5. Footer</text>
  <text x="132" y="428" fill="#78909c" font-size="12">metadatos · se escribe al final, cuando ya se conocen las estadísticas</text>
  <text x="56" y="450" fill="#546e7a" font-size="11" font-family="monospace">Esquema · Versión del formato</text>
  <text x="56" y="472" fill="#546e7a" font-size="11" font-family="monospace">RG0 · Country · RLE_DICTIONARY · SNAPPY · offset ·</text>
  <text x="404" y="472" fill="#37474f" font-size="11" font-weight="bold" font-family="monospace">min=France max=Germany nulls=0</text>
  <text x="56" y="492" fill="#546e7a" font-size="11" font-family="monospace">RG0 · Revenue · PLAIN · SNAPPY · offset ·</text>
  <text x="404" y="492" fill="#37474f" font-size="11" font-weight="bold" font-family="monospace">min=0,01 max=99,99 nulls=134</text>
  <text x="56" y="512" fill="#546e7a" font-size="11" font-family="monospace">RG1 · ...</text>
  <text x="56" y="530" fill="#37474f" font-size="11" font-style="italic">Las estadísticas en negrita son las que permiten el predicate pushdown</text>

  <!-- Magic number inferior -->
  <rect x="40" y="548" width="700" height="24" fill="#37474f"/>
  <text x="52" y="565" fill="#eceff1" font-size="11" font-family="monospace">Footer length (4 bytes) · PAR1</text>
  <text x="728" y="565" text-anchor="end" fill="#90a4ae" font-size="11">se lee primero</text>
</svg>
