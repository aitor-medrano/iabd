<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 650" width="1190" height="650" font-family="Helvetica, Arial, sans-serif">
<!--
  Paleta IABD:
    #2b3a42 oscuro   origen / control / metadatos
    #3fa39b teal     catálogo
    #7d5ba6 morado   motores
    #c0603f terracota datos / almacenamiento
    #2f6fed azul     nodo lab y flechas de datos
    #4f8a6d verde    Airflow / orquestación
    #8a8f98 gris     contenedores de un solo uso (init)
-->
<rect x="0" y="0" width="1190" height="650" fill="#ffffff"/>
<text x="40" y="38" font-size="20" fill="#2b3a42" text-anchor="start" font-weight="bold">Profiles y contenedores</text>
<text x="40" y="60" font-size="13" fill="#5c626e" text-anchor="start">Los profiles de componente encienden piezas del stack; los paraguas los combinan. Trino y retail_db no tienen profile propio.</text>
<rect x="40" y="84" width="790" height="30" rx="7" fill="#e8f4f2" stroke="#3fa39b" stroke-width="1.5"/>
<rect x="40" y="84" width="6" height="30" fill="#3fa39b"/>
<text x="58" y="103" font-size="13" fill="#3fa39b" text-anchor="start" font-weight="bold">lake  =  hadoop + hive + trino + minio + retail_db   ·   consultar el lago</text>
<rect x="520" y="120" width="630" height="30" rx="7" fill="#eaf1fb" stroke="#2f6fed" stroke-width="1.5"/>
<rect x="520" y="120" width="6" height="30" fill="#2f6fed"/>
<text x="538" y="139" font-size="13" fill="#2f6fed" text-anchor="start" font-weight="bold">elt  =  minio + lab + airflow   ·   ingesta, dbt y orquestación</text>
<rect x="40" y="156" width="1110" height="30" rx="7" fill="#f2eef7" stroke="#7d5ba6" stroke-width="1.5"/>
<rect x="40" y="156" width="6" height="30" fill="#7d5ba6"/>
<text x="58" y="175" font-size="13" fill="#7d5ba6" text-anchor="start" font-weight="bold">all  =  todo el stack</text>
<line x1="520" y1="84" x2="520" y2="214" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<line x1="830" y1="84" x2="830" y2="214" stroke="#8a8f98" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<text x="675.0" y="206" font-size="10" fill="#8a8f98" text-anchor="middle" font-style="italic">compartidos por lake y elt</text>
<rect x="40" y="214" width="150" height="32" rx="7" fill="#2b3a42"/>
<text x="115.0" y="235" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">hadoop</text>
