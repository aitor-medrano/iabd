<rect x="1000" y="214" width="150" height="32" rx="7" fill="#4f8a6d"/>
<text x="1075.0" y="235" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">airflow</text>
<rect x="1008" y="254" width="134" height="28" rx="5" fill="#f4f5f7" stroke="#d7dae0" stroke-width="1.3"/>
<text x="1075.0" y="272" font-size="12" fill="#2b3a42" text-anchor="middle">postgres-airflow</text>
<rect x="1008" y="288" width="134" height="28" rx="5" fill="#f4f5f7" stroke="#d7dae0" stroke-width="1.3"/>
<text x="1075.0" y="306" font-size="12" fill="#2b3a42" text-anchor="middle">airflow-apiserver</text>
<rect x="1008" y="322" width="134" height="28" rx="5" fill="#f4f5f7" stroke="#d7dae0" stroke-width="1.3"/>
<text x="1075.0" y="340" font-size="12" fill="#2b3a42" text-anchor="middle">airflow-scheduler</text>
<rect x="1008" y="356" width="134" height="28" rx="5" fill="#f4f5f7" stroke="#d7dae0" stroke-width="1.3"/>
<text x="1075.0" y="374" font-size="10.5" fill="#2b3a42" text-anchor="middle">airflow-dag-processor</text>
<rect x="1008" y="390" width="134" height="28" rx="5" fill="#ffffff" stroke="#8a8f98" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="1075.0" y="408" font-size="12" fill="#5c626e" text-anchor="middle">airflow-init</text>
<rect x="195.0" y="440" width="160" height="24" rx="6" fill="#eef6f4" stroke="#3fa39b" stroke-width="1"/>
<text x="275.0" y="456" font-size="11" fill="#2b3a42" text-anchor="middle">catálogo (metadatos)</text>
<rect x="675.0" y="440" width="160" height="24" rx="6" fill="#f1f3f4" stroke="#2b3a42" stroke-width="1"/>
<text x="755.0" y="456" font-size="11" fill="#2b3a42" text-anchor="middle">origen (datos de negocio)</text>
<text x="40" y="494" font-size="12" fill="#5c626e" text-anchor="start">· trino sólo arranca con lake o all: sin metastore ni almacenamiento no tendría nada que consultar.</text>
<text x="40" y="514" font-size="12" fill="#5c626e" text-anchor="start">· hive no puede levantarse solo: el metastore espera a hdfs-init, así que siempre va con hadoop (o dentro de lake).</text>
<text x="40" y="534" font-size="12" fill="#5c626e" text-anchor="start">· retail_db (mysql-retail + retail-init) la arrastran lab, airflow, lake y elt; en lake la usa Trino para federar con MySQL.</text>
<text x="40" y="554" font-size="12" fill="#5c626e" text-anchor="start">· airflow también arrastra minio y retail_db, pero no el nodo lab: ejecuta dlt y dbt en su propio contenedor.</text>
<rect x="40" y="584" width="1110" height="34" rx="8" fill="#fafafa" stroke="#e8e8e8"/>
<rect x="58" y="595" width="14" height="14" rx="3" fill="#f4f5f7" stroke="#d7dae0" stroke-width="1.2"/>
<text x="80" y="606" font-size="12" fill="#5c626e" text-anchor="start">servicio</text>
<rect x="150" y="595" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="172" y="606" font-size="12" fill="#5c626e" text-anchor="start">contenedor de un solo uso (init)</text>
<rect x="380" y="593" width="30" height="18" rx="4" fill="#ffffff" stroke="#2b3a42" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="418" y="606" font-size="12" fill="#5c626e" text-anchor="start">grupo sin profile propio</text>
</svg>