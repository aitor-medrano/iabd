<text x="435.0" y="272" font-size="12" fill="#2b3a42" text-anchor="middle">trino</text>
<rect x="520" y="214" width="150" height="32" rx="7" fill="#c0603f"/>
<text x="595.0" y="235" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">minio</text>
<rect x="528" y="254" width="134" height="28" rx="5" fill="#f4f5f7" stroke="#d7dae0" stroke-width="1.3"/>
<text x="595.0" y="272" font-size="12" fill="#2b3a42" text-anchor="middle">minio</text>
<rect x="528" y="288" width="134" height="28" rx="5" fill="#ffffff" stroke="#8a8f98" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="595.0" y="306" font-size="12" fill="#5c626e" text-anchor="middle">minio-init</text>
<rect x="680" y="214" width="150" height="32" rx="7" fill="#ffffff" stroke="#2b3a42" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="755.0" y="229" font-size="14" fill="#2b3a42" text-anchor="middle" font-weight="bold">retail_db</text>
<text x="755.0" y="241" font-size="9" fill="#5c626e" text-anchor="middle" font-style="italic">sin profile propio</text>
