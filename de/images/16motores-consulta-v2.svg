<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!--
    Motores de consulta sobre el lago — las tres capas
    Paleta bloque de ingeniería de datos:
      #2d3142  oscuro    control / metadatos / texto principal
      #3fa39b  teal      catálogo
      #6a4c93  púrpura   motores
      #b04a34  terracota datos / almacenamiento
      #2f6fed  azul      flechas de datos
      #8a8f98  gris      elementos sin catálogo compartido (trazo discontinuo)
  -->

  <defs>
    <marker id="fl-teal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fa39b"/>
    </marker>
    <marker id="fl-gris" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
    <marker id="fl-azul" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <!-- ============ etiquetas de capa ============ -->
  <text x="20" y="100" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.4">MOTOR</text>
  <text x="20" y="116" font-size="10" fill="#a8adb5">ejecuta el SQL</text>

  <text x="20" y="280" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.4">CATÁLOGO</text>
  <text x="20" y="296" font-size="10" fill="#a8adb5">qué tablas hay</text>

  <text x="20" y="460" font-size="10" font-weight="600" fill="#8a8f98" letter-spacing="0.9">ALMACENAMIENTO</text>
  <text x="20" y="476" font-size="10" fill="#a8adb5">los bytes</text>

  <text x="20" y="200" font-size="10" font-style="italic" fill="#3fa39b">¿qué columnas</text>
  <text x="20" y="213" font-size="10" font-style="italic" fill="#3fa39b">tiene la tabla?</text>

  <text x="20" y="380" font-size="10" font-style="italic" fill="#3fa39b">ruta · formato</text>
  <text x="20" y="393" font-size="10" font-style="italic" fill="#3fa39b">particiones</text>

  <!-- ============ capa 1: motores ============ -->
  <rect x="160" y="70" width="160" height="72" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="240" y="102" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">DuckDB</text>
  <text x="240" y="122" font-size="11" fill="#6b7280" text-anchor="middle">in-process</text>

  <rect x="340" y="70" width="160" height="72" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="420" y="102" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">Hive</text>
  <text x="420" y="122" font-size="11" fill="#6b7280" text-anchor="middle">batch sobre Tez</text>

  <rect x="520" y="70" width="160" height="72" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="600" y="102" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">Trino</text>
  <text x="600" y="122" font-size="11" fill="#6b7280" text-anchor="middle">MPP en memoria</text>

  <rect x="700" y="70" width="180" height="72" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="790" y="102" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">AWS Athena</text>
  <text x="790" y="122" font-size="11" fill="#6b7280" text-anchor="middle">serverless</text>

  <!-- ============ flechas motor -> catálogo ============ -->
  <path d="M240,142 L240,244" stroke="#8a8f98" stroke-width="1.6" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-gris)"/>
  <path d="M420,142 L455,244" stroke="#3fa39b" stroke-width="1.8" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-teal)"/>
  <path d="M600,142 L565,244" stroke="#3fa39b" stroke-width="1.8" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-teal)"/>
  <path d="M790,142 L790,244" stroke="#3fa39b" stroke-width="1.8" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-teal)"/>

  <!-- ============ capa 2: catálogo ============ -->
  <rect x="160" y="250" width="160" height="72" rx="8" fill="#f5f6f7" stroke="#8a8f98"
        stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="240" y="278" font-size="13" font-weight="600" fill="#5c626b" text-anchor="middle">árbol de directorios</text>
  <text x="240" y="296" font-size="10.5" fill="#8a8f98" text-anchor="middle">no hay catálogo</text>
  <text x="240" y="310" font-size="10.5" fill="#8a8f98" text-anchor="middle">compartido</text>

  <rect x="340" y="250" width="340" height="72" rx="8" fill="#eaf5f4" stroke="#3fa39b" stroke-width="1.8"/>
  <text x="510" y="280" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">Hive Metastore</text>
  <text x="510" y="300" font-size="11" fill="#6b7280" text-anchor="middle">servicio Thrift :9083 · metadatos en MySQL</text>

  <rect x="700" y="250" width="180" height="72" rx="8" fill="#eaf5f4" stroke="#3fa39b" stroke-width="1.8"/>
  <text x="790" y="278" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">AWS Glue</text>
  <text x="790" y="294" font-size="11" fill="#6b7280" text-anchor="middle">Data Catalog</text>
  <text x="790" y="310" font-size="10.5" fill="#6b7280" text-anchor="middle">API compatible con HMS</text>

  <!-- ============ flechas catálogo -> almacenamiento ============ -->
  <path d="M240,322 L275,424" stroke="#8a8f98" stroke-width="1.6" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-gris)"/>
  <path d="M450,322 L330,424" stroke="#3fa39b" stroke-width="1.8" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-teal)"/>
  <path d="M570,322 L560,424" stroke="#3fa39b" stroke-width="1.8" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-teal)"/>
  <path d="M790,322 L790,424" stroke="#3fa39b" stroke-width="1.8" stroke-dasharray="5 4"
        fill="none" marker-end="url(#fl-teal)"/>

  <!-- ============ capa 3: almacenamiento ============ -->
  <rect x="160" y="430" width="250" height="72" rx="8" fill="#f9eeea" stroke="#b04a34" stroke-width="1.6"/>
  <text x="285" y="460" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">MinIO</text>
  <text x="285" y="480" font-size="11" fill="#6b7280" text-anchor="middle">s3://processed/retail_db/orders/</text>

  <rect x="430" y="430" width="250" height="72" rx="8" fill="#f9eeea" stroke="#b04a34" stroke-width="1.6"/>
  <text x="555" y="460" font-size="16" font-weight="600" fill="#2d3142" text-anchor="middle">HDFS</text>
  <text x="555" y="480" font-size="11" fill="#6b7280" text-anchor="middle">hdfs://namenode:8020/user/iabd/</text>

  <rect x="700" y="430" width="180" height="72" rx="8" fill="#f9eeea" stroke="#b04a34" stroke-width="1.6"/>
  <text x="790" y="460" font-size="15" font-weight="600" fill="#2d3142" text-anchor="middle">Amazon S3</text>
  <text x="790" y="480" font-size="11" fill="#6b7280" text-anchor="middle">el mismo Parquet</text>

  <!-- ============ los bytes suben al motor ============ -->
  <path d="M150,466 L132,466 L132,106 L150,106" stroke="#2f6fed" stroke-width="2"
        fill="none" marker-end="url(#fl-azul)"/>
  <text x="122" y="300" font-size="10.5" fill="#2f6fed" text-anchor="middle"
        transform="rotate(-90 122 300)">los bytes suben al motor</text>

  <!-- ============ cierre ============ -->
  <line x1="160" y1="528" x2="880" y2="528" stroke="#e3e5e8" stroke-width="1"/>
  <text x="520" y="548" font-size="12.5" fill="#2d3142" text-anchor="middle">
    El dato no se mueve. Lo único que cambia de una columna a otra es la fila de arriba.
  </text>

</svg>
