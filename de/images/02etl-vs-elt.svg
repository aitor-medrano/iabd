<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- fondo blanco (coherente con las figuras raster de la página) -->
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ================= ETL ================= -->
  <text x="24" y="46" font-size="16" font-weight="700" fill="#0f172a">ETL</text>
  <text x="66" y="46" font-size="13" fill="#64748b">extract → transform → load · se transforma <tspan font-style="italic">antes</tspan> de cargar</text>

  <!-- Fuentes -->
  <rect x="16" y="78" width="96" height="50" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="64" y="107" font-size="13" fill="#334155" text-anchor="middle">Fuentes</text>
  <!-- Extract -->
  <rect x="140" y="78" width="92" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="186" y="107" font-size="13" fill="#1e40af" text-anchor="middle">Extract</text>
  <!-- Transform (destacado) -->
  <rect x="260" y="78" width="98" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="309" y="107" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Transform</text>
  <!-- Load -->
  <rect x="386" y="78" width="92" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="432" y="107" font-size="13" fill="#1e40af" text-anchor="middle">Load</text>
  <!-- Data warehouse -->
  <rect x="506" y="72" width="146" height="62" rx="8" fill="#d1fae5" stroke="#10b981"/>
  <text x="579" y="99" font-size="13" fill="#065f46" text-anchor="middle" font-weight="600">Data</text>
  <text x="579" y="116" font-size="13" fill="#065f46" text-anchor="middle" font-weight="600">warehouse</text>

  <!-- flechas ETL -->
  <line x1="112" y1="103" x2="138" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="232" y1="103" x2="258" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="358" y1="103" x2="384" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="478" y1="103" x2="504" y2="103" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="24" y="160" font-size="12" fill="#64748b">La transformación se realiza <tspan font-weight="600" fill="#92400e">fuera del destino</tspan> (área de staging), antes de la carga.</text>

  <!-- separador -->
  <line x1="24" y1="188" x2="696" y2="188" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= ELT ================= -->
  <text x="24" y="228" font-size="16" font-weight="700" fill="#0f172a">ELT</text>
  <text x="66" y="228" font-size="13" fill="#64748b">extract → load → transform · se carga en crudo y se transforma <tspan font-style="italic">dentro</tspan></text>

  <!-- Fuentes -->
  <rect x="16" y="278" width="96" height="50" rx="8" fill="#eef2f7" stroke="#94a3b8"/>
  <text x="64" y="307" font-size="13" fill="#334155" text-anchor="middle">Fuentes</text>
  <!-- Extract -->
  <rect x="140" y="278" width="92" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="186" y="307" font-size="13" fill="#1e40af" text-anchor="middle">Extract</text>
  <!-- Load -->
  <rect x="260" y="278" width="92" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="306" y="307" font-size="13" fill="#1e40af" text-anchor="middle">Load</text>

  <!-- Contenedor: destino con Transform dentro -->
  <rect x="380" y="256" width="316" height="94" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-dasharray="0"/>
  <text x="538" y="274" font-size="12.5" fill="#065f46" text-anchor="middle" font-weight="700">Data lake / lakehouse</text>
  <!-- Transform dentro -->
  <rect x="396" y="288" width="120" height="46" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="456" y="315" font-size="13" fill="#92400e" text-anchor="middle" font-weight="600">Transform</text>
  <!-- Modelos / marts -->
  <rect x="556" y="288" width="124" height="46" rx="8" fill="#ccfbf1" stroke="#14b8a6"/>
  <text x="618" y="311" font-size="13" fill="#0f766e" text-anchor="middle">Modelos</text>
  <text x="618" y="326" font-size="11" fill="#0f766e" text-anchor="middle">(marts)</text>

  <!-- flechas ELT -->
  <line x1="112" y1="303" x2="138" y2="303" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="232" y1="303" x2="258" y2="303" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="352" y1="303" x2="378" y2="303" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="516" y1="311" x2="554" y2="311" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="24" y="378" font-size="12" fill="#64748b">Se carga en crudo y la transformación ocurre <tspan font-weight="600" fill="#92400e">dentro del propio destino</tspan>.</text>
</svg>
