<text x="328" y="236" font-size="11" fill="#2f6fed" text-anchor="start">S3 :9000</text>
<text x="328" y="250" font-size="11" fill="#2f6fed" text-anchor="start">claves de MinIO</text>
<path d="M460,194 L460,298" fill="none" stroke="#3fa39b" stroke-width="1.6" marker-end="url(#f3fa39b)"/>
