<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 516" width="900" height="516" font-family="Helvetica, Arial, sans-serif">
<!--
  Paleta IABD:
    #2b3a42 oscuro   origen / control / metadatos
    #3fa39b teal     catálogo
    #7d5ba6 morado   motores
    #c0603f terracota datos / almacenamiento
    #2f6fed azul     nodo lab y flechas de datos
    #4f8a6d verde    Airflow / orquestación (aquí: commit aceptado)
    #8a8f98 gris     contenedores de un solo uso (init)
-->
<defs><marker id="f2b3a42" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a42"/></marker><marker id="f3fa39b" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fa39b"/></marker><marker id="f2f6fed" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker><marker id="f8a8f98" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/></marker></defs>
<rect x="0" y="0" width="900" height="516" fill="#ffffff"/>
<text x="40" y="38" font-size="20" fill="#2b3a42" font-weight="bold">Polaris en el stack del curso</text>
<text x="40" y="60" font-size="13" fill="#5c626e">Receta lab,polaris. Los motores hablan con el catálogo por REST y con MinIO con sus propias claves.</text>
<rect x="30" y="80" width="840" height="310" rx="9" fill="#f1f3f4" stroke="#2b3a42" stroke-width="1.2"/>
<rect x="30" y="80" width="6" height="310" fill="#2b3a42"/>
<text x="48" y="102" font-size="13" fill="#2b3a42" font-weight="bold">Red bigdata</text>
