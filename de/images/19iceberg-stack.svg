<text x="170.0" y="159.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">lab</text>
<text x="170.0" y="175.0" font-size="11" fill="#ffffff" text-anchor="middle">JupyterLab · PyIceberg · DuckDB</text>
<rect x="360" y="130" width="200" height="64" rx="7" fill="#3fa39b" stroke="#3fa39b" stroke-width="1.4"/>
<text x="460.0" y="159.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">polaris</text>
<text x="460.0" y="175.0" font-size="11" fill="#ffffff" text-anchor="middle">REST :8181 · salud :8182</text>
<rect x="650" y="130" width="180" height="64" rx="7" fill="#f4f5f7" stroke="#d7dae0" stroke-width="1.4"/>
<text x="740.0" y="159.0" font-size="13" fill="#2b3a42" text-anchor="middle" font-weight="bold">postgres-polaris</text>
<text x="740.0" y="175.0" font-size="11" fill="#5c626e" text-anchor="middle">estado del catálogo</text>
<rect x="360" y="300" width="200" height="64" rx="7" fill="#c0603f" stroke="#c0603f" stroke-width="1.4"/>
<text x="460.0" y="329.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">minio</text>
<text x="460.0" y="345.0" font-size="11" fill="#ffffff" text-anchor="middle">s3://warehouse/iceberg</text>
