<text x="752" y="222" font-size="10" fill="#5c626e" text-anchor="start" font-style="italic">crea realm y root</text>
<path d="M650,334 L562,192" fill="none" stroke="#8a8f98" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#f8a8f98)"/>
<text x="740" y="370" font-size="10" fill="#5c626e" text-anchor="middle" font-style="italic">crea el catálogo iabd</text>
<text x="40" y="420" font-size="12" fill="#5c626e" text-anchor="start">· stsUnavailable: MinIO no reparte credenciales temporales, así que cada motor usa las claves de MinIO.</text>
<text x="40" y="440" font-size="12" fill="#5c626e" text-anchor="start">· El catálogo anuncia http://minio:9000: las tablas solo se leen desde la red bigdata.</text>
<rect x="40" y="462" width="820" height="34" rx="8" fill="#fafafa" stroke="#e8e8e8"/>
<rect x="58" y="472" width="14" height="14" rx="3" fill="#ffffff" stroke="#8a8f98" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="80" y="483" font-size="12" fill="#5c626e" text-anchor="start">contenedor de un solo uso (init)</text>
<line x1="330" y1="479" x2="370" y2="479" stroke="#2f6fed" stroke-width="1.6"/>
<text x="378" y="483" font-size="12" fill="#5c626e" text-anchor="start">acceso a datos</text>
