<svg viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="428" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Estrella vs copo de nieve</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" fill="#64748b">la misma dimensión de producto, desnormalizada o normalizada</text>

  <line x1="360" y1="72" x2="360" y2="410" stroke="#e2e8f0"/>

  <!-- ============ ESTRELLA (izquierda) ============ -->
  <text x="180" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Estrella</text>
  <text x="180" y="110" text-anchor="middle" font-size="10.5" fill="#64748b">dimensión desnormalizada · 1 JOIN</text>

  <!-- fact -->
  <rect x="40" y="150" width="120" height="24" rx="4" fill="#f59e0b"/>
  <text x="100" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">fact_ventas</text>
  <rect x="40" y="174" width="120" height="54" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="50" y="192" font-size="10.5" fill="#92400e">producto_id · FK</text>
  <text x="50" y="208" font-size="10.5" fill="#78350f">cantidad</text>
  <text x="50" y="224" font-size="10.5" fill="#78350f">importe</text>

  <!-- dim_producto (aplanada) -->
  <rect x="210" y="150" width="130" height="24" rx="4" fill="#10b981"/>
  <text x="275" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">dim_producto</text>
  <rect x="210" y="174" width="130" height="90" fill="#ecfdf5" stroke="#10b981"/>
  <text x="220" y="192" font-size="10.5" fill="#065f46">producto_id · PK</text>
  <text x="220" y="208" font-size="10.5" fill="#065f46">nombre</text>
  <text x="220" y="224" font-size="10.5" fill="#065f46">categoria</text>
  <text x="220" y="240" font-size="10.5" fill="#065f46">departamento</text>
  <text x="220" y="256" font-size="10.5" fill="#065f46">precio_catalogo</text>

  <line x1="160" y1="188" x2="210" y2="188" stroke="#94a3b8" stroke-width="1.6"/>

  <!-- ============ COPO DE NIEVE (derecha) ============ -->
  <text x="540" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6">Copo de nieve</text>
  <text x="540" y="110" text-anchor="middle" font-size="10.5" fill="#64748b">dimensión normalizada · 3 JOINs</text>

  <!-- fact -->
  <rect x="392" y="200" width="110" height="24" rx="4" fill="#f59e0b"/>
  <text x="447" y="217" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">fact_ventas</text>
  <rect x="392" y="224" width="110" height="40" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="400" y="242" font-size="10" fill="#92400e">producto_id · FK</text>
  <text x="400" y="257" font-size="10" fill="#78350f">importe</text>

  <!-- dim_producto -->
  <rect x="540" y="120" width="150" height="22" rx="4" fill="#8b5cf6"/>
  <text x="615" y="136" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">dim_producto</text>
  <rect x="540" y="142" width="150" height="52" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="548" y="159" font-size="10" fill="#5b21b6">producto_id · PK</text>
  <text x="548" y="174" font-size="10" fill="#5b21b6">nombre</text>
  <text x="548" y="189" font-size="10" fill="#5b21b6">categoria_id · FK</text>

  <!-- dim_categoria -->
  <rect x="540" y="212" width="150" height="22" rx="4" fill="#8b5cf6"/>
  <text x="615" y="228" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">dim_categoria</text>
  <rect x="540" y="234" width="150" height="52" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="548" y="251" font-size="10" fill="#5b21b6">categoria_id · PK</text>
  <text x="548" y="266" font-size="10" fill="#5b21b6">nombre</text>
  <text x="548" y="281" font-size="10" fill="#5b21b6">departamento_id · FK</text>

  <!-- dim_departamento -->
  <rect x="540" y="304" width="150" height="22" rx="4" fill="#8b5cf6"/>
  <text x="615" y="320" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">dim_departamento</text>
  <rect x="540" y="326" width="150" height="38" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="548" y="343" font-size="10" fill="#5b21b6">departamento_id · PK</text>
  <text x="548" y="358" font-size="10" fill="#5b21b6">nombre</text>

  <!-- relaciones copo -->
  <line x1="502" y1="224" x2="540" y2="168" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="615" y1="194" x2="615" y2="212" stroke="#94a3b8" stroke-width="1.6"/>
  <line x1="615" y1="286" x2="615" y2="304" stroke="#94a3b8" stroke-width="1.6"/>

  <!-- nota inferior -->
  <text x="180" y="300" text-anchor="middle" font-size="10.5" fill="#059669">menos JOINs · más redundancia</text>
  <text x="180" y="316" text-anchor="middle" font-size="10.5" fill="#059669">· recomendado por defecto</text>
  <text x="447" y="392" text-anchor="middle" font-size="10.5" fill="#7c3aed">menos redundancia · más JOINs</text>
</svg>
