<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!--
    El modelo map-reduce: splits, map, shuffle y reduce
    Paleta bloque de ingeniería de datos:
      #2d3142  oscuro    texto principal
      #3fa39b  teal      resultado
      #6a4c93  púrpura   tareas de cómputo
      #b04a34  terracota almacenamiento / bloques
      #2f6fed  azul      flechas de datos
      #8a8f98  gris      anotaciones
  -->

  <defs>
    <marker id="fl-azul" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
    <marker id="fl-azul-fino" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>

  <!-- ============ etiquetas de banda ============ -->
  <text x="95"  y="50" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.3" text-anchor="middle">FICHERO</text>
  <text x="295" y="50" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.3" text-anchor="middle">MAP</text>
  <text x="470" y="50" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.3" text-anchor="middle">SHUFFLE</text>
  <text x="645" y="50" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.3" text-anchor="middle">REDUCE</text>
  <text x="820" y="50" font-size="11" font-weight="600" fill="#8a8f98" letter-spacing="1.3" text-anchor="middle">RESULTADO</text>

  <text x="470" y="100" font-size="11.5" fill="#2f6fed" text-anchor="middle">reparto por hash(categoria)</text>
  <text x="470" y="118" font-size="10.5" fill="#8a8f98" text-anchor="middle">cada categoría, entera, en un solo reductor</text>

  <!-- ============ fichero y bloques ============ -->
  <rect x="30" y="80" width="140" height="365" rx="8" fill="#fdf7f5" stroke="#b04a34" stroke-width="1.6"/>
  <text x="100" y="106" font-size="13.5" font-weight="600" fill="#2d3142" text-anchor="middle">ventas.csv</text>
  <text x="100" y="123" font-size="10" fill="#6b7280" text-anchor="middle">647 MB en HDFS</text>

  <rect x="46" y="145" width="108" height="80" rx="6" fill="#f4dcd4" stroke="#b04a34" stroke-width="1.3"/>
  <text x="100" y="180" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">bloque 1</text>
  <text x="100" y="197" font-size="10" fill="#6b7280" text-anchor="middle">split 1</text>

  <rect x="46" y="235" width="108" height="80" rx="6" fill="#f4dcd4" stroke="#b04a34" stroke-width="1.3"/>
  <text x="100" y="270" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">bloque 2</text>
  <text x="100" y="287" font-size="10" fill="#6b7280" text-anchor="middle">split 2</text>

  <rect x="46" y="325" width="108" height="80" rx="6" fill="#f4dcd4" stroke="#b04a34" stroke-width="1.3"/>
  <text x="100" y="360" font-size="12" font-weight="600" fill="#2d3142" text-anchor="middle">bloque 3</text>
  <text x="100" y="377" font-size="10" fill="#6b7280" text-anchor="middle">split 3</text>

  <!-- ============ tareas map ============ -->
  <rect x="230" y="145" width="130" height="80" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="295" y="176" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">map</text>
  <text x="295" y="194" font-size="10" fill="#6b7280" text-anchor="middle">5.000.000 líneas</text>
  <text x="295" y="208" font-size="10" fill="#6b7280" text-anchor="middle">→ 6 pares</text>

  <rect x="230" y="235" width="130" height="80" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="295" y="266" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">map</text>
  <text x="295" y="284" font-size="10" fill="#6b7280" text-anchor="middle">5.000.000 líneas</text>
  <text x="295" y="298" font-size="10" fill="#6b7280" text-anchor="middle">→ 6 pares</text>

  <rect x="230" y="325" width="130" height="80" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="295" y="356" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">map</text>
  <text x="295" y="374" font-size="10" fill="#6b7280" text-anchor="middle">5.000.000 líneas</text>
  <text x="295" y="388" font-size="10" fill="#6b7280" text-anchor="middle">→ 6 pares</text>

  <!-- ============ tareas reduce ============ -->
  <rect x="580" y="190" width="130" height="80" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="645" y="221" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">reduce</text>
  <text x="645" y="239" font-size="9.5" fill="#6b7280" text-anchor="middle">Electronica · Deporte</text>
  <text x="645" y="252" font-size="9.5" fill="#6b7280" text-anchor="middle">Juguetes</text>

  <rect x="580" y="280" width="130" height="80" rx="8" fill="#f2eef7" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="645" y="311" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">reduce</text>
  <text x="645" y="329" font-size="9.5" fill="#6b7280" text-anchor="middle">Hogar · Calzado</text>
  <text x="645" y="342" font-size="9.5" fill="#6b7280" text-anchor="middle">Ropa</text>

  <!-- ============ resultado ============ -->
  <rect x="760" y="230" width="120" height="90" rx="8" fill="#eaf5f4" stroke="#3fa39b" stroke-width="1.8"/>
  <text x="820" y="268" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">6 filas</text>
  <text x="820" y="288" font-size="10" fill="#6b7280" text-anchor="middle">conteo y suma</text>
  <text x="820" y="302" font-size="10" fill="#6b7280" text-anchor="middle">por categoría</text>

  <!-- ============ flechas fichero -> map ============ -->
  <path d="M154,185 L222,185" stroke="#2f6fed" stroke-width="2" fill="none" marker-end="url(#fl-azul)"/>
  <path d="M154,275 L222,275" stroke="#2f6fed" stroke-width="2" fill="none" marker-end="url(#fl-azul)"/>
  <path d="M154,365 L222,365" stroke="#2f6fed" stroke-width="2" fill="none" marker-end="url(#fl-azul)"/>

  <!-- ============ shuffle: cada map alimenta a los dos reduce ============ -->
  <path d="M360,185 L572,225" stroke="#2f6fed" stroke-width="1.2" opacity="0.75" fill="none" marker-end="url(#fl-azul-fino)"/>
  <path d="M360,185 L572,300" stroke="#2f6fed" stroke-width="1.2" opacity="0.75" fill="none" marker-end="url(#fl-azul-fino)"/>
  <path d="M360,275 L572,232" stroke="#2f6fed" stroke-width="1.2" opacity="0.75" fill="none" marker-end="url(#fl-azul-fino)"/>
  <path d="M360,275 L572,308" stroke="#2f6fed" stroke-width="1.2" opacity="0.75" fill="none" marker-end="url(#fl-azul-fino)"/>
  <path d="M360,365 L572,240" stroke="#2f6fed" stroke-width="1.2" opacity="0.75" fill="none" marker-end="url(#fl-azul-fino)"/>
  <path d="M360,365 L572,316" stroke="#2f6fed" stroke-width="1.2" opacity="0.75" fill="none" marker-end="url(#fl-azul-fino)"/>

  <!-- ============ flechas reduce -> resultado ============ -->
  <path d="M710,230 L752,265" stroke="#2f6fed" stroke-width="2" fill="none" marker-end="url(#fl-azul)"/>
  <path d="M710,320 L752,285" stroke="#2f6fed" stroke-width="2" fill="none" marker-end="url(#fl-azul)"/>

  <!-- ============ el estrechamiento ============ -->
  <line x1="30" y1="480" x2="880" y2="480" stroke="#e3e5e8" stroke-width="1"/>

  <text x="100" y="508" font-size="15" font-weight="600" fill="#b04a34" text-anchor="middle">15.000.000</text>
  <text x="100" y="524" font-size="10" fill="#8a8f98" text-anchor="middle">líneas leídas</text>

  <text x="295" y="508" font-size="15" font-weight="600" fill="#6a4c93" text-anchor="middle">18</text>
  <text x="295" y="524" font-size="10" fill="#8a8f98" text-anchor="middle">pares parciales</text>

  <text x="470" y="508" font-size="15" font-weight="600" fill="#2f6fed" text-anchor="middle">400 B</text>
  <text x="470" y="524" font-size="10" fill="#8a8f98" text-anchor="middle">por la red</text>

  <text x="645" y="508" font-size="15" font-weight="600" fill="#6a4c93" text-anchor="middle">6</text>
  <text x="645" y="524" font-size="10" fill="#8a8f98" text-anchor="middle">grupos</text>

  <text x="820" y="508" font-size="15" font-weight="600" fill="#3fa39b" text-anchor="middle">6</text>
  <text x="820" y="524" font-size="10" fill="#8a8f98" text-anchor="middle">filas</text>

  <text x="200" y="512" font-size="14" fill="#c4c8ce" text-anchor="middle">▸</text>
  <text x="385" y="512" font-size="14" fill="#c4c8ce" text-anchor="middle">▸</text>
  <text x="560" y="512" font-size="14" fill="#c4c8ce" text-anchor="middle">▸</text>
  <text x="735" y="512" font-size="14" fill="#c4c8ce" text-anchor="middle">▸</text>

  <text x="455" y="558" font-size="10.5" font-style="italic" fill="#8a8f98" text-anchor="middle">
    El número de tareas lo decide el motor: en el stack de clase, Tez agrupó los 5 bloques en un solo split y lanzó un único map.
  </text>

</svg>
