<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#ffffff"/>

  <!-- Namenode -->
  <rect x="280" y="16" width="220" height="58" rx="8" fill="#263238"/>
  <text x="390" y="42" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Namenode</text>
  <text x="390" y="61" text-anchor="middle" fill="#B0BEC5" font-size="11">metadatos · mapa de bloques</text>

  <!-- dotted links namenode -> racks -->
  <line x1="330" y1="74" x2="210" y2="222" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="450" y1="74" x2="570" y2="222" stroke="#B0BEC5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="390" y="96" text-anchor="middle" fill="#78909C" font-size="10.5">sabe en qué nodo está cada bloque</text>

  <!-- File label -->
  <text x="60" y="128" fill="#37474F" font-size="13" font-weight="bold">peliculas.csv · 600 MB</text>

  <!-- File bar (blocks) -->
  <g>
    <rect x="60"  y="138" width="100" height="40" fill="#1565C0"/>
    <rect x="160" y="138" width="100" height="40" fill="#ECEFF1" stroke="#90A4AE"/>
    <rect x="260" y="138" width="100" height="40" fill="#ECEFF1" stroke="#90A4AE"/>
    <rect x="360" y="138" width="100" height="40" fill="#ECEFF1" stroke="#90A4AE"/>
    <rect x="460" y="138" width="60"  height="40" fill="#ECEFF1" stroke="#90A4AE"/>
    <line x1="160" y1="138" x2="160" y2="178" stroke="#ffffff" stroke-width="2"/>
    <text x="110" y="163" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">B1</text>
    <text x="210" y="163" text-anchor="middle" fill="#37474F" font-size="14">B2</text>
    <text x="310" y="163" text-anchor="middle" fill="#37474F" font-size="14">B3</text>
    <text x="410" y="163" text-anchor="middle" fill="#37474F" font-size="14">B4</text>
    <text x="490" y="163" text-anchor="middle" fill="#37474F" font-size="14">B5</text>
  </g>
  <text x="545" y="163" fill="#607D8B" font-size="12">5 bloques de 128 MB</text>
  <text x="60" y="202" fill="#607D8B" font-size="12">factor de replicación = 3  →  15 copias repartidas entre los datanodes</text>

  <!-- Rack labels -->
  <text x="45"  y="238" fill="#455A64" font-size="13" font-weight="bold">Rack A</text>
  <line x1="90" y1="233" x2="379" y2="233" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="405" y="238" fill="#455A64" font-size="13" font-weight="bold">Rack B</text>
  <line x1="452" y1="233" x2="739" y2="233" stroke="#CFD8DC" stroke-width="1.5"/>

  <!-- Datanodes -->
  <!-- helper: each DN = box + header + 2 chips -->
  <!-- DN1 -->
  <g>
    <rect x="40" y="250" width="105" height="150" rx="6" fill="#FAFAFA" stroke="#B0BEC5"/>
    <rect x="40" y="250" width="105" height="26" rx="6" fill="#455A64"/>
    <text x="92" y="268" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">DN1</text>
    <rect x="55" y="290" width="75" height="24" rx="4" fill="#1565C0"/>
    <text x="92" y="307" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">B1</text>
    <rect x="55" y="326" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="92" y="343" text-anchor="middle" fill="#546E7A" font-size="12">B3</text>
  </g>
  <!-- DN2 -->
  <g>
    <rect x="157" y="250" width="105" height="150" rx="6" fill="#FAFAFA" stroke="#B0BEC5"/>
    <rect x="157" y="250" width="105" height="26" rx="6" fill="#455A64"/>
    <text x="209" y="268" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">DN2</text>
    <rect x="172" y="290" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="209" y="307" text-anchor="middle" fill="#546E7A" font-size="12">B2</text>
    <rect x="172" y="326" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="209" y="343" text-anchor="middle" fill="#546E7A" font-size="12">B4</text>
  </g>
  <!-- DN3 -->
  <g>
    <rect x="274" y="250" width="105" height="150" rx="6" fill="#FAFAFA" stroke="#B0BEC5"/>
    <rect x="274" y="250" width="105" height="26" rx="6" fill="#455A64"/>
    <text x="326" y="268" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">DN3</text>
    <rect x="289" y="290" width="75" height="24" rx="4" fill="#1565C0"/>
    <text x="326" y="307" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">B1</text>
    <rect x="289" y="326" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="326" y="343" text-anchor="middle" fill="#546E7A" font-size="12">B5</text>
  </g>
  <!-- DN4 -->
  <g>
    <rect x="400" y="250" width="105" height="150" rx="6" fill="#FAFAFA" stroke="#B0BEC5"/>
    <rect x="400" y="250" width="105" height="26" rx="6" fill="#455A64"/>
    <text x="452" y="268" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">DN4</text>
    <rect x="415" y="290" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="452" y="307" text-anchor="middle" fill="#546E7A" font-size="12">B2</text>
    <rect x="415" y="326" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="452" y="343" text-anchor="middle" fill="#546E7A" font-size="12">B3</text>
  </g>
  <!-- DN5 -->
  <g>
    <rect x="517" y="250" width="105" height="150" rx="6" fill="#FAFAFA" stroke="#B0BEC5"/>
    <rect x="517" y="250" width="105" height="26" rx="6" fill="#455A64"/>
    <text x="569" y="268" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">DN5</text>
    <rect x="532" y="290" width="75" height="24" rx="4" fill="#1565C0"/>
    <text x="569" y="307" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">B1</text>
    <rect x="532" y="326" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="569" y="343" text-anchor="middle" fill="#546E7A" font-size="12">B4</text>
  </g>
  <!-- DN6 -->
  <g>
    <rect x="634" y="250" width="105" height="150" rx="6" fill="#FAFAFA" stroke="#B0BEC5"/>
    <rect x="634" y="250" width="105" height="26" rx="6" fill="#455A64"/>
    <text x="686" y="268" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">DN6</text>
    <rect x="649" y="290" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="686" y="307" text-anchor="middle" fill="#546E7A" font-size="12">B2</text>
    <rect x="649" y="326" width="75" height="24" rx="4" fill="#ECEFF1" stroke="#90A4AE"/>
    <text x="686" y="343" text-anchor="middle" fill="#546E7A" font-size="12">B5</text>
  </g>

  <!-- caption -->
  <rect x="40" y="418" width="16" height="16" rx="3" fill="#1565C0"/>
  <text x="64" y="431" fill="#455A64" font-size="12.5">Las 3 réplicas de B1 caen en nodos distintos (DN1 y DN3 en Rack A, DN5 en Rack B)</text>
  <text x="64" y="447" fill="#455A64" font-size="12.5">Si se cae un nodo o un rack entero, el bloque sobrevive.</text>
</svg>
