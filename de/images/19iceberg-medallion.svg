<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Helvetica, Arial, sans-serif">
<!--
  Paleta IABD:
    #2b3a42 oscuro   origen / control / metadatos
    #3fa39b teal     catálogo
    #7d5ba6 morado   motores
    #c0603f terracota datos / almacenamiento
    #2f6fed azul     nodo lab y flechas de datos
    #4f8a6d verde    Airflow / orquestación (aquí: commit aceptado)
    #8a8f98 gris     contenedores de un solo uso (init)
-->
<defs><marker id="f2f6fed" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/></marker><marker id="f7d5ba6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d5ba6"/></marker></defs>
<rect x="0" y="0" width="900" height="460" fill="#ffffff"/>
<text x="40" y="38" font-size="20" fill="#2b3a42" font-weight="bold">Capas del lakehouse de retail_db</text>
<text x="40" y="60" font-size="13" fill="#5c626e">Las capas se construyen sin Spark; en la sesión siguiente Spark leerá las mismas tablas.</text>
