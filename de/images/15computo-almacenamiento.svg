<svg viewBox="0 0 840 450" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="840" height="450" fill="#ffffff"/>

  <!-- divider -->
  <line x1="420" y1="20" x2="420" y2="430" stroke="#CFD8DC" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ===== LEFT: coupled (HDFS) ===== -->
  <text x="40" y="40" fill="#263238" font-size="17" font-weight="bold">Acoplado &#8212; HDFS / Hadoop</text>

  <!-- node template x3 -->
  <!-- node 1 -->
  <g>
    <rect x="40" y="62" width="340" height="80" rx="8" fill="#FAFAFA" stroke="#90A4AE"/>
    <text x="55" y="86" fill="#607D8B" font-size="11" transform="rotate(-90 55 86)">Nodo 1</text>
    <rect x="78" y="72" width="284" height="28" rx="5" fill="#EDE7F6" stroke="#B39DDB"/>
    <text x="220" y="91" text-anchor="middle" fill="#6A1B9A" font-size="12.5" font-weight="bold">C&#243;mputo (YARN)</text>
    <rect x="78" y="104" width="284" height="28" rx="5" fill="#E3F2FD" stroke="#90CAF9"/>
    <text x="220" y="123" text-anchor="middle" fill="#1565C0" font-size="12.5" font-weight="bold">Almacenamiento (HDFS)</text>
  </g>
  <!-- node 2 -->
  <g>
    <rect x="40" y="156" width="340" height="80" rx="8" fill="#FAFAFA" stroke="#90A4AE"/>
    <text x="55" y="180" fill="#607D8B" font-size="11" transform="rotate(-90 55 180)">Nodo 2</text>
    <rect x="78" y="166" width="284" height="28" rx="5" fill="#EDE7F6" stroke="#B39DDB"/>
    <text x="220" y="185" text-anchor="middle" fill="#6A1B9A" font-size="12.5" font-weight="bold">C&#243;mputo (YARN)</text>
    <rect x="78" y="198" width="284" height="28" rx="5" fill="#E3F2FD" stroke="#90CAF9"/>
    <text x="220" y="217" text-anchor="middle" fill="#1565C0" font-size="12.5" font-weight="bold">Almacenamiento (HDFS)</text>
  </g>
  <!-- node 3 -->
  <g>
    <rect x="40" y="250" width="340" height="80" rx="8" fill="#FAFAFA" stroke="#90A4AE"/>
    <text x="55" y="274" fill="#607D8B" font-size="11" transform="rotate(-90 55 274)">Nodo 3</text>
    <rect x="78" y="260" width="284" height="28" rx="5" fill="#EDE7F6" stroke="#B39DDB"/>
    <text x="220" y="279" text-anchor="middle" fill="#6A1B9A" font-size="12.5" font-weight="bold">C&#243;mputo (YARN)</text>
    <rect x="78" y="292" width="284" height="28" rx="5" fill="#E3F2FD" stroke="#90CAF9"/>
    <text x="220" y="311" text-anchor="middle" fill="#1565C0" font-size="12.5" font-weight="bold">Almacenamiento (HDFS)</text>
  </g>

  <text x="210" y="360" text-anchor="middle" fill="#455A64" font-size="12.5">el c&#243;mputo se ejecuta donde est&#225;n los datos (<tspan font-style="italic">data locality</tspan>)</text>
  <text x="210" y="392" text-anchor="middle" fill="#37474F" font-size="13" font-weight="bold">Escalas c&#243;mputo y almacenamiento a la vez</text>

  <!-- ===== RIGHT: decoupled (object storage) ===== -->
  <text x="452" y="40" fill="#263238" font-size="17" font-weight="bold">Desacoplado &#8212; object storage</text>

  <!-- compute layer (ephemeral, dashed) -->
  <rect x="452" y="62" width="356" height="96" rx="8" fill="#F5F5F5" stroke="#90A4AE" stroke-dasharray="6 4"/>
  <text x="466" y="82" fill="#455A64" font-size="12.5" font-weight="bold">Capa de c&#243;mputo (ef&#237;mera)</text>
  <rect x="470" y="94" width="96" height="48" rx="6" fill="#EDE7F6" stroke="#6A1B9A"/>
  <text x="518" y="123" text-anchor="middle" fill="#6A1B9A" font-size="13" font-weight="bold">Spark</text>
  <rect x="582" y="94" width="96" height="48" rx="6" fill="#EDE7F6" stroke="#6A1B9A"/>
  <text x="630" y="123" text-anchor="middle" fill="#6A1B9A" font-size="13" font-weight="bold">DuckDB</text>
  <rect x="694" y="94" width="96" height="48" rx="6" fill="#EDE7F6" stroke="#6A1B9A"/>
  <text x="742" y="123" text-anchor="middle" fill="#6A1B9A" font-size="13" font-weight="bold">Trino</text>
  <text x="808" y="120" text-anchor="end" fill="#9E9E9E" font-size="10.5"></text>

  <!-- arrow between layers -->
  <line x1="630" y1="160" x2="630" y2="248" stroke="#1565C0" stroke-width="2.4" marker-end="url(#ah)" marker-start="url(#ah2)"/>
  <rect x="516" y="188" width="228" height="24" rx="4" fill="#ffffff"/>
  <text x="630" y="205" text-anchor="middle" fill="#1565C0" font-size="12.5" font-weight="bold">los datos viajan por red &#183; s3a://</text>

  <!-- storage layer (persistent) -->
  <rect x="452" y="250" width="356" height="96" rx="8" fill="#FBE9E7" stroke="#C0392B"/>
  <text x="466" y="270" fill="#C0392B" font-size="12.5" font-weight="bold">Object storage (persistente)</text>
  <rect x="470" y="282" width="100" height="48" rx="6" fill="#C0392B"/>
  <text x="520" y="311" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">raw-data</text>
  <rect x="586" y="282" width="100" height="48" rx="6" fill="#C0392B"/>
  <text x="636" y="311" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">processed</text>
  <rect x="702" y="282" width="88" height="48" rx="6" fill="#C0392B"/>
  <text x="746" y="311" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">warehouse</text>

  <text x="630" y="392" text-anchor="middle" fill="#37474F" font-size="13" font-weight="bold">Escalas cada capa por separado</text>

  <!-- markers -->
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1565C0"/>
    </marker>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#1565C0"/>
    </marker>
  </defs>
</svg>
